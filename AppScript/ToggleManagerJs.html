<script>
/* ==========================================================================
   Toggle Slides — Toggle Manager
   Owns the project's single-canvas state (no slides, no cross-canvas
   linking — see CLAUDE.md's Toggle Slides section for why that whole
   concept doesn't apply here) plus the toggle mechanic itself: a set of
   nav buttons, each claiming zero or more elements, where pressing a
   button flips that button's own on/off state independently of every
   other button — any number can be on at once, unlike Animated Slides
   v2's mutually-exclusive slide switching.

   `elements` / `nodes` (id -> data / id -> node) describe every element on
   the one canvas and are mutated in place, never reassigned — CanvasEditor
   holds a direct reference to both from construction time, same reference-
   identity rule v2's SlideManager follows for the same reason.

   VISIBILITY MODEL: an element belongs to zero or more buttons
   (`button.elementIds`). Zero buttons = always visible (static content,
   e.g. a title or background shape). One or more = visible whenever ANY
   of its owning buttons is currently on ("any-of", not "all-of" — the
   common case is exactly one owning button, but this stays correct if an
   author ever assigns the same element to two buttons deliberately).
   Applying that opacity is `applyVisibility()`, driven by `visibleState`
   (buttonId -> boolean), which callers only ever touch through
   `toggleButton()`.

   EDIT vs PREVIEW: `applyVisibility()` is deliberately never called
   automatically on every change — the authoring canvas needs every
   element fully visible and selectable at all times to be editable at
   all (an author can't drag-position an element that's opacity-0), which
   would conflict with also showing real on/off state on the same nodes.
   index.html's Preview mode is what decides when `applyVisibility()`
   actually runs; see its comment for the edit/preview split.
   ========================================================================== */

function defaultCanvasSettings() {
  return {
    width: 1920, height: 1080,
    backgroundColor: '#ffffff',
    snapToGrid: false, gridSize: 20,
    nav: defaultNavStyle(),
  };
}

class ToggleManager {
  /**
   * @param svg, layer     the canvas SVG root and its element layer <g>
   * @param elements       [data, ...] — flat list, no slide grouping
   * @param buttons        [{ id, label, elementIds: [...], defaultOn }, ...]
   * @param canvasSettings optional — defaults via defaultCanvasSettings()
   */
  constructor({ svg, layer, elements, buttons, canvasSettings }) {
    this.svg = svg;
    this.layer = layer;
    this.canvasSettings = canvasSettings || defaultCanvasSettings(); // mutated in place — see setState
    this.buttons = buttons && buttons.length ? buttons : [];
    this.elements = {}; // mutated in place — see class comment
    this.nodes = {};    // mutated in place
    this.editor = null; // set via attachEditor()
    this.onChange = () => {}; // hook for UI (canvas, button bar, layer panel) to refresh
    this.visibleState = {}; // buttonId -> boolean, runtime-only (not part of getState()) — see class comment
    this.lastAddedButtonId = null; // one-shot, same pattern as v2's lastAddedSlideId — set BEFORE onChange fires
    this._order = null; // stacking order of element ids, same role as v2's _activeOrder

    this._rebuild(elements || []);
  }

  attachEditor(editor) {
    this.editor = editor;
  }

  /** Full rebuild of the canvas from a flat element list — used on
   *  construction, load, and undo/redo jumps. There's no partial/animated
   *  variant needed here (unlike v2's _rebuildActiveSlide vs goToSlide)
   *  since there's only ever one canvas to populate, never a transition
   *  between two. */
  _rebuild(elementList) {
    Object.values(this.nodes).forEach((node) => node.group.remove());
    Object.keys(this.nodes).forEach((k) => delete this.nodes[k]);
    Object.keys(this.elements).forEach((k) => delete this.elements[k]);
    elementList.forEach((data) => {
      const d = { ...data };
      const node = createElementNode(d);
      this.layer.appendChild(node.group);
      gsap.set(node.group, { opacity: 1 });
      this.elements[d.id] = d;
      this.nodes[d.id] = node;
      if (this.editor) this.editor.registerNode(node);
    });
    this._order = elementList.map((e) => e.id);
  }

  /* ---- Layer order (bottom-to-top, index 0 = furthest back — same
     convention as v2's `elements` array) ---- */

  _currentOrder() {
    const liveIds = Object.keys(this.elements);
    if (!this._order) return liveIds;
    const known = this._order.filter((id) => this.elements[id]);
    const newIds = liveIds.filter((id) => !known.includes(id));
    const merged = [...known, ...newIds];
    this._order = merged;
    return merged;
  }

  getLayerOrder() {
    return this._currentOrder();
  }

  /** direction: -1 to move up the stack (later = on top), 1 to move down —
   *  same convention (and the same historically-inverted bug to watch for)
   *  as v2's SlideManager.reorderLayer(). */
  reorderLayer(id, direction) {
    const order = this._currentOrder();
    const i = order.indexOf(id);
    const j = i - direction;
    if (i === -1 || j < 0 || j >= order.length) return;
    [order[i], order[j]] = [order[j], order[i]];
    this._order = order;
    order.forEach((elId) => this.layer.appendChild(this.nodes[elId].group));
    this.onChange();
  }

  moveLayerBefore(draggedId, targetId) {
    const order = this._currentOrder();
    const fromIndex = order.indexOf(draggedId);
    if (fromIndex === -1 || draggedId === targetId) return;
    order.splice(fromIndex, 1);
    const targetIndex = order.indexOf(targetId); // recomputed AFTER removal — correct regardless of drag direction
    if (targetIndex === -1) { order.splice(fromIndex, 0, draggedId); return; }
    order.splice(targetIndex + 1, 0, draggedId);
    this._order = order;
    order.forEach((elId) => this.layer.appendChild(this.nodes[elId].group));
    this.onChange();
  }

  /* ---- Toggle buttons (CRUD) ---- */

  addButton(afterIndex = this.buttons.length - 1) {
    const btn = { id: 'btn-' + Date.now(), label: 'Button ' + (this.buttons.length + 1), elementIds: [], defaultOn: false };
    this.buttons.splice(afterIndex + 1, 0, btn);
    this.lastAddedButtonId = btn.id; // set BEFORE onChange, which triggers the render synchronously
    this.onChange();
    return btn.id;
  }

  duplicateButton(index) {
    const original = this.buttons[index];
    const btn = {
      id: 'btn-' + Date.now(),
      label: original.label + ' copy',
      elementIds: [...original.elementIds],
      defaultOn: original.defaultOn,
    };
    this.buttons.splice(index + 1, 0, btn);
    this.lastAddedButtonId = btn.id;
    this.onChange();
    return btn.id;
  }

  deleteButton(index) {
    if (this.buttons.length <= 1) return; // never delete the last button
    delete this.visibleState[this.buttons[index].id];
    this.buttons.splice(index, 1);
    this.onChange();
  }

  reorderButton(fromIndex, toIndex) {
    if (fromIndex === toIndex || fromIndex < 0 || fromIndex >= this.buttons.length || toIndex < 0 || toIndex >= this.buttons.length) return;
    const [moved] = this.buttons.splice(fromIndex, 1);
    this.buttons.splice(toIndex, 0, moved);
    this.onChange();
  }

  /* ---- Element <-> button assignment ---- */

  /** Which buttons (if any) currently claim this element — "any-of"
   *  membership, see class comment. Usually 0 or 1 entries in practice. */
  buttonsForElement(id) {
    return this.buttons.filter((b) => b.elementIds.includes(id));
  }

  /** Replaces this element's full set of owning buttons in one go — the
   *  property panel's checkbox list calls this with whichever ids are
   *  currently checked, rather than one add/remove call per checkbox. */
  setElementButtons(id, buttonIds) {
    this.buttons.forEach((b) => {
      const shouldOwn = buttonIds.includes(b.id);
      const idx = b.elementIds.indexOf(id);
      if (shouldOwn && idx === -1) b.elementIds.push(id);
      if (!shouldOwn && idx !== -1) b.elementIds.splice(idx, 1);
    });
    this.onChange();
  }

  /* ---- Visibility (preview / export runtime only — see class comment) ---- */

  /** Resets visibleState from each button's authored defaultOn — called
   *  whenever (re-)entering preview/playback, never during normal editing. */
  resetVisibleState() {
    this.visibleState = {};
    this.buttons.forEach((b) => { this.visibleState[b.id] = !!b.defaultOn; });
  }

  /** Flips one button's on/off state and re-applies visibility. Multiple
   *  buttons can be on simultaneously — this never touches any button
   *  other than the one pressed, which is the entire difference from v2's
   *  goToSlide() (exclusive) that this tool exists to replace. */
  toggleButton(id, animate = true) {
    this.visibleState[id] = !this.visibleState[id];
    this.applyVisibility(animate);
    this.onChange();
  }

  isButtonOn(id) {
    return !!this.visibleState[id];
  }

  /** Set of currently-on button ids — what the nav bar's `refresh()`
   *  wants for highlighting, computed fresh each call rather than kept as
   *  a parallel copy of visibleState. */
  getActiveButtonIds() {
    return new Set(Object.keys(this.visibleState).filter((id) => this.visibleState[id]));
  }

  /** Applies visibleState to every element's node opacity/pointer-events.
   *  An element with no owning buttons is always visible. Safe to call
   *  freely (e.g. after a button/assignment edit while already in
   *  preview) — recomputes every element from scratch rather than
   *  diffing, since this canvas is small enough that it's not worth the
   *  bookkeeping a diff would need. */
  applyVisibility(animate = true) {
    Object.keys(this.elements).forEach((id) => {
      const owners = this.buttonsForElement(id);
      const visible = owners.length === 0 || owners.some((b) => this.visibleState[b.id]);
      const node = this.nodes[id];
      if (!node) return;
      node.group.style.pointerEvents = visible ? '' : 'none';
      if (animate) {
        gsap.to(node.group, { opacity: visible ? 1 : 0, duration: 0.4 });
      } else {
        gsap.set(node.group, { opacity: visible ? 1 : 0 });
      }
    });
  }

  /** Undoes applyVisibility for normal editing — every element back to
   *  fully visible and interactive, regardless of button assignment or
   *  on/off state. Called whenever leaving preview mode. */
  showAllElements() {
    Object.values(this.nodes).forEach((node) => {
      node.group.style.pointerEvents = '';
      gsap.set(node.group, { opacity: 1 });
    });
  }

  /* ---- History integration ---- */

  getState() {
    return {
      canvasSettings: { ...this.canvasSettings, nav: { ...this.canvasSettings.nav } },
      elements: this._currentOrder().filter((id) => this.elements[id]).map((id) => ({ ...this.elements[id] })),
      buttons: this.buttons.map((b) => ({ ...b, elementIds: [...b.elementIds] })),
    };
  }

  setState(snap) {
    // Mutate canvasSettings (and its nested nav object) in place — same
    // reference-identity reasoning as v2's SlideManager.setState().
    const incoming = snap.canvasSettings || defaultCanvasSettings();
    const incomingNav = incoming.nav || defaultNavStyle();
    Object.keys(this.canvasSettings).forEach((k) => { if (k !== 'nav') delete this.canvasSettings[k]; });
    Object.entries(incoming).forEach(([k, v]) => { if (k !== 'nav') this.canvasSettings[k] = v; });
    Object.keys(this.canvasSettings.nav).forEach((k) => delete this.canvasSettings.nav[k]);
    Object.assign(this.canvasSettings.nav, incomingNav);

    this.buttons.length = 0;
    (snap.buttons || []).forEach((b) => this.buttons.push({
      id: b.id, label: b.label, elementIds: [...(b.elementIds || [])], defaultOn: !!b.defaultOn,
    }));

    this.lastAddedButtonId = null; // a fresh load/undo/redo is never itself an "add"
    this._order = null;
    this._rebuild(snap.elements || []);
    if (this.editor) this.editor.deselect();
    this.onChange();
  }
}
</script>
