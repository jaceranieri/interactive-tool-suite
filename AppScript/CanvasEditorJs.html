<script>
/* ==========================================================================
   Animated Slides v2 — Canvas Editor
   Selection (including multi-select), drag-to-move, and resize handles.
   Sits entirely ON TOP of element-renderer.js — never modifies it, only
   reads/writes the same element `data` objects and calls
   updateElementNode() to reflect changes. This is what keeps the renderer
   reusable unchanged inside the exported player, which has none of this.

   Property editing used to live here too, as a floating contextual popup
   positioned beside the selected element. It now lives in index.html's
   right-docked #property-panel side panel instead (same .side-panel
   system as Layers/Settings, matching Tabbed Panels' pattern) — this
   class only ever reports selection changes via onSelect/onChange, it no
   longer renders any property UI itself. buildField() and
   setFieldOnSelection() below are the two pieces index.html reuses to
   build that panel's inputs, kept here because they're the code that
   actually knows how to read/write a field on element `data` safely
   (history begin/commit, updateElementNode, handle repositioning).

   MULTI-SELECT: Shift or Cmd/Ctrl+click adds to the selection; clicking an
   already-selected element with a modifier held removes it. Multiple
   selected elements move together as a rigid group and can be deleted or
   duplicated together. Resizing stays single-element only — resizing
   several different-typed elements as one operation isn't supported.
   Editing a field shared by every selected type's schema (see
   index.html's commonFieldsForSelection()) fans out via
   setFieldOnSelection() below.

   Coordinate handling: every pointer interaction converts screen (mouse)
   coordinates to the SVG's own user-space coordinates via
   svg.getScreenCTM().inverse() — the robust, browser-native way to do this
   regardless of how the SVG is scaled on screen. Given this project's
   history with viewBox-scaling bugs, this is deliberately NOT done via any
   manual scale-factor guessing.
   ========================================================================== */

function screenToSVGPoint(svg, clientX, clientY) {
  const pt = svg.createSVGPoint();
  pt.x = clientX;
  pt.y = clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

/** Perpendicular distance from point p to the line through a/b — the core
 *  measurement Ramer-Douglas-Peucker simplification is built on. */
function _perpendicularDistance(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy);
  if (len === 0) return Math.hypot(p.x - a.x, p.y - a.y);
  return Math.abs(dy * p.x - dx * p.y + b.x * a.y - b.y * a.x) / len;
}

/**
 * Ramer-Douglas-Peucker simplification — thins a raw mouse-tracked point
 * trail down to the few points that actually matter, discarding the small
 * back-and-forth wobble a mouse (or a shaky hand on a tablet) adds between
 * them. This is the "de-jitter" step; the curve actually drawn through
 * whatever points survive is a separate concern handled by
 * smoothedPathFromPoints() in element-renderer.js — that function is the
 * single source of truth for turning points into a path, reused unchanged
 * by the exported player, so it can't depend on anything pointer-specific
 * like this does.
 */
function simplifyPoints(points, epsilon) {
  if (points.length < 3) return points;
  let maxDist = 0, maxIndex = 0;
  const first = points[0], last = points[points.length - 1];
  for (let i = 1; i < points.length - 1; i++) {
    const d = _perpendicularDistance(points[i], first, last);
    if (d > maxDist) { maxDist = d; maxIndex = i; }
  }
  if (maxDist > epsilon) {
    const left = simplifyPoints(points.slice(0, maxIndex + 1), epsilon);
    const right = simplifyPoints(points.slice(maxIndex), epsilon);
    return left.slice(0, -1).concat(right);
  }
  return [first, last];
}

class CanvasEditor {
  /**
   * @param svg       the root <svg> element
   * @param elements  { id: data } — the live element data objects
   * @param nodes     { id: node } — the corresponding renderer nodes
   * @param onChange  called with (data) whenever a field or drag changes
   *                  something — hook for autosave/dirty-state elsewhere
   * @param onSelect  called with an array of currently-selected ids
   */
  constructor({ svg, elements, nodes, onChange = () => {}, onSelect = () => {}, history = null, getCanvasSettings = () => null, onDrawModeChange = () => {} }) {
    this.svg = svg;
    this.elements = elements;
    this.nodes = nodes;
    this.onChange = onChange;
    this.onSelect = onSelect;
    this.history = history;
    // A getter, not a captured object — canvasSettings can be replaced
    // wholesale on load/undo, so reading it fresh each time avoids the
    // same staleness problem fixed for elements/nodes earlier.
    this.getCanvasSettings = getCanvasSettings;
    this.selectedIds = new Set();
    this.handleLayer = null;
    this._multiHandleLayers = [];
    this.drag = null; // active drag/resize state, or null
    this.drawMode = false; // true while the freehand ("Draw") tool is armed
    this.freehand = null; // active in-progress stroke, or null
    this.onDrawModeChange = onDrawModeChange;
    this.guidesLayer = null; // the <g> guide lines render into — see renderGuides()
    this.selectedGuide = null; // { orientation, id } of a clicked guide, or null — independent of selectedIds (an element and a guide are never selected at once)
    this.guideDrag = null; // active guide-reposition drag state, or null
    this._activeSnapGuideIds = new Set(); // guide ids currently engaged by a drag-in-progress, for the live highlight

    this.svg.addEventListener('pointerdown', (e) => {
      // Draw mode intercepts pointerdown regardless of what's underneath —
      // an author needs to be able to draw on top of existing elements,
      // not just on empty canvas. Per-element handlers (_attachSelection)
      // check the same flag and bail out before stopPropagation(), so this
      // still fires even when the pointerdown started on top of a node.
      if (this.drawMode) { this._startFreehand(e); return; }
      if (e.target === this.svg) {
        if (this.selectedGuide) { this.selectedGuide = null; this.renderGuides(); }
        this._startMarquee(e);
      }
    });

    Object.values(nodes).forEach((node) => this._attachSelection(node));

    window.addEventListener('pointermove', (e) => this._onPointerMove(e));
    window.addEventListener('pointerup', () => this._onPointerUp());
    window.addEventListener('keydown', (e) => {
      // Don't hijack keys while someone's typing in a property field —
      // only treat these as canvas shortcuts when focus isn't on a
      // text-editing control.
      const tag = document.activeElement && document.activeElement.tagName;
      const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      if (isTyping) return;

      if (e.key === 'Escape' && this.drawMode) {
        this.setDrawMode(false);
        return;
      }

      // Shift+R toggles guides on/off (visibility AND snapping — see
      // defaultGuides()'s doc comment) — checked before the
      // selectedIds-gated shortcuts below since it should work regardless
      // of what, if anything, is selected.
      if (e.shiftKey && !e.metaKey && !e.ctrlKey && e.key.toLowerCase() === 'r') {
        e.preventDefault();
        this.toggleGuidesEnabled();
        return;
      }

      if (this.selectedGuide && (e.key === 'Delete' || e.key === 'Backspace')) {
        this.removeGuide(this.selectedGuide.orientation, this.selectedGuide.id);
        this.selectedGuide = null;
        return;
      }

      if (this.selectedIds.size === 0) return;

      if (e.key === 'Delete' || e.key === 'Backspace') {
        this.deleteSelected();
        return;
      }

      const cmd = e.metaKey || e.ctrlKey;
      if (cmd && e.key.toLowerCase() === 'd') {
        e.preventDefault(); // otherwise the browser's own "bookmark this page" fires
        this.duplicateSelected();
        return;
      }

      const nudgeMap = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
      if (nudgeMap[e.key]) {
        e.preventDefault();
        const [dx, dy] = nudgeMap[e.key];
        const step = e.shiftKey ? 10 : 1; // Shift = bigger nudge, same convention as most design tools
        this.nudgeSelected(dx * step, dy * step);
      }
    });
  }

  /** The "primary" selected id — the most recently selected one. Used
   *  wherever exactly one id is needed (the single-element property panel, drag
   *  anchoring). Returns null when nothing is selected. */
  get selectedId() {
    if (this.selectedIds.size === 0) return null;
    return [...this.selectedIds][this.selectedIds.size - 1];
  }

  /** Clones every selected element a short offset away and selects the
   *  copies — undoable, same as everything else. */
  duplicateSelected() {
    if (this.selectedIds.size === 0) return;
    const ids = [...this.selectedIds];
    if (this.history) this.history.beginAction();
    const layer = this.svg.querySelector('#elements-layer');
    const newIds = [];
    ids.forEach((id, i) => {
      const original = this.elements[id];
      const newId = original.type + '-' + Date.now() + '-' + i + '-' + Math.floor(Math.random() * 1000);
      const clone = { ...original, id: newId, x: original.x + 24, y: original.y + 24 };
      if (clone.name) clone.name = clone.name + ' copy';
      const node = createElementNode(clone);
      layer.appendChild(node.group);
      gsap.to(node.group, { opacity: 1, duration: 0.3 });
      this.elements[newId] = clone;
      this.nodes[newId] = node;
      this.registerNode(node);
      newIds.push(newId);
    });
    if (this.history) this.history.commitAction();
    this.onChange({ duplicatedIds: newIds });
    this.selectedIds = new Set(newIds);
    this._renderHandles();
    this.onSelect([...this.selectedIds]);
  }

  /** Nudges every selected element by (dx, dy) — a single undo step per
   *  key press, same pattern as a field commit. */
  nudgeSelected(dx, dy) {
    if (this.selectedIds.size === 0) return;
    if (this.history) this.history.beginAction();
    this.selectedIds.forEach((id) => {
      const data = this.elements[id];
      if (!data) return;
      data.x += dx;
      data.y += dy;
      updateElementNode(this.nodes[id], data, { animate: false });
    });
    this._renderHandles();
    if (this.history) this.history.commitAction();
    this.onChange({});
  }

  /** Removes every selected element entirely — from the canvas, the live
   *  data/node maps, and (via history) is undoable as one step. */
  deleteSelected() {
    if (this.selectedIds.size === 0) return;
    const ids = [...this.selectedIds];
    if (this.history) this.history.beginAction();
    ids.forEach((id) => {
      const node = this.nodes[id];
      if (node) node.group.remove();
      delete this.nodes[id];
      delete this.elements[id];
    });
    this.deselect();
    if (this.history) this.history.commitAction();
    this.onChange({ deletedIds: ids });
  }

  _attachSelection(node) {
    node.group.style.cursor = 'move';
    node.group.addEventListener('pointerdown', (e) => {
      // Let the event bubble up to the svg-level listener instead, which
      // starts a freehand stroke — don't stopPropagation()/select here.
      if (this.drawMode) return;
      e.stopPropagation();
      const id = node.group.getAttribute('id');
      const additive = e.shiftKey || e.metaKey || e.ctrlKey;

      if (additive && this.selectedIds.has(id)) {
        // Clicking an already-selected element with a modifier held toggles it off.
        this.selectedIds.delete(id);
        this._renderHandles();
        this.onSelect([...this.selectedIds]);
        return;
      }

      if (!additive && this.selectedIds.has(id) && this.selectedIds.size > 1) {
        // A plain click landed on an element that's already part of a
        // multi-selection — keep the whole group selected and start
        // dragging it together, rather than collapsing down to just this
        // one. This is what lets you grab ANY selected element to move
        // the group, not just whichever one you originally shift-clicked.
        // If it turns out there's no real drag (just a click), pointerup
        // narrows the selection down to this element instead — see
        // narrowCandidate handling in _onPointerMove/_onPointerUp.
        this._startDrag(e, { type: 'move', id });
        this.drag.narrowCandidate = id;
        return;
      }

      this.select(id, { additive });
      this._startDrag(e, { type: 'move', id });
    });

    const id = node.group.getAttribute('id');
    const hoverOutline = document.createElementNS(svgNS, 'rect');
    hoverOutline.setAttribute('fill', 'none');
    hoverOutline.setAttribute('stroke', '#8A9291');
    hoverOutline.setAttribute('stroke-width', 1.5);
    hoverOutline.setAttribute('pointer-events', 'none');
    hoverOutline.style.display = 'none';
    node.group.appendChild(hoverOutline);
    node._hoverOutline = hoverOutline;

    node.group.addEventListener('pointerenter', () => {
      if (this.drag || this.selectedIds.has(id)) return;
      const box = this._getLocalBBox(this.elements[id]);
      hoverOutline.setAttribute('x', box.x);
      hoverOutline.setAttribute('y', box.y);
      hoverOutline.setAttribute('width', box.width);
      hoverOutline.setAttribute('height', box.height);
      hoverOutline.style.display = '';
    });
    node.group.addEventListener('pointerleave', () => {
      hoverOutline.style.display = 'none';
    });
  }

  /** Local (group-relative) bounding box for a given element's data —
   *  used by both the hover outline and resize-handle placement. Arrows
   *  need real min/max math since their line can extend in any direction
   *  from the origin, not just down-right. */
  _getLocalBBox(data) {
    if (data.type === 'arrow') {
      const angleRad = (data.angle || 0) * Math.PI / 180;
      const x2 = (data.length || 200) * Math.sin(angleRad);
      const y2 = -(data.length || 200) * Math.cos(angleRad);
      const pad = (data.strokeWidth || 8) / 2;
      return {
        x: Math.min(0, x2) - pad, y: Math.min(0, y2) - pad,
        width: Math.abs(x2) + pad * 2, height: Math.abs(y2) + pad * 2,
      };
    }
    return { x: 0, y: 0, width: data.width, height: data.height };
  }

  /** @param options.additive  true (Shift/Cmd/Ctrl held) adds to the
   *  current selection instead of replacing it.
   *  @param options.origin  passed through to onSelect as meta.origin —
   *  'canvas' (default) for a real canvas interaction, or 'layers-panel'
   *  when layer-panel.js triggers this from a row click. index.html uses
   *  this to decide whether to auto-open the Properties panel: selecting
   *  on the canvas should jump straight to editing it, but selecting a
   *  row while browsing Layers shouldn't yank the panel away from Layers. */
  select(id, { additive = false, origin = 'canvas' } = {}) {
    try {
      if (!additive) {
        this.selectedIds.forEach((sid) => {
          if (this.nodes[sid] && this.nodes[sid]._hoverOutline) this.nodes[sid]._hoverOutline.style.display = 'none';
        });
        this.selectedIds.clear();
      }
      this.selectedIds.add(id);
      if (this.nodes[id] && this.nodes[id]._hoverOutline) this.nodes[id]._hoverOutline.style.display = 'none';
      this._renderHandles();
      this.onSelect([...this.selectedIds], { origin });
    } catch (err) {
      // Caught (not left uncaught) so the real error reaches the console
      // with its actual message/stack — an uncaught error bubbling
      // through GSAP's cross-origin code gets reported by the browser as
      // an opaque "Script error." with no detail otherwise.
      console.error('CanvasEditor.select failed for id=' + id, err);
    }
  }

  deselect() {
    this.selectedIds.clear();
    this._clearHandles();
    this.onSelect([]);
  }

  /** Attaches selection/hover behavior to a node created outside the
   *  editor's own lifecycle — e.g. by SlideManager when an element first
   *  appears on a slide during a transition. */
  registerNode(node) {
    this._attachSelection(node);
  }

  /** Arms/disarms the freehand drawing tool. While on, clicking anywhere
   *  on the canvas (even on top of existing elements) starts a new stroke
   *  instead of selecting/dragging — deselects first so the property panel
   *  for whatever was previously selected doesn't stay open while
   *  drawing. Stays on across multiple strokes; the
   *  caller (the left-rail button, or Escape) toggles it back off. */
  setDrawMode(on) {
    if (this.drawMode === on) return;
    this.drawMode = on;
    if (on) this.deselect();
    this.svg.style.cursor = on ? 'crosshair' : '';
    this.onDrawModeChange(on);
  }

  /** Starts capturing a new freehand stroke — a lightweight raw polyline
   *  preview (no smoothing yet, for responsiveness while the pointer is
   *  still moving); the real smoothed path is only built once in
   *  _finishFreehand(), from element-renderer.js's smoothedPathFromPoints,
   *  the same function the exported player uses. */
  _startFreehand(e) {
    const startSVG = screenToSVGPoint(this.svg, e.clientX, e.clientY);
    const preview = document.createElementNS(svgNS, 'path');
    preview.setAttribute('fill', 'none');
    preview.setAttribute('stroke', ELEMENT_TYPES.draw.fields.color.default);
    preview.setAttribute('stroke-width', ELEMENT_TYPES.draw.fields.strokeWidth.default);
    preview.setAttribute('stroke-linecap', 'round');
    preview.setAttribute('stroke-linejoin', 'round');
    preview.setAttribute('pointer-events', 'none');
    preview.setAttribute('d', `M ${startSVG.x} ${startSVG.y}`);
    const layer = this.svg.querySelector('#elements-layer') || this.svg;
    layer.appendChild(preview);
    this.freehand = { rawPoints: [startSVG], lastPoint: startSVG, previewEl: preview };
  }

  _updateFreehand(e) {
    const pt = screenToSVGPoint(this.svg, e.clientX, e.clientY);
    const last = this.freehand.lastPoint;
    // Throttle: skip points that barely moved from the last recorded one —
    // keeps the raw point count (and therefore the RDP simplification
    // cost) reasonable without visibly affecting the traced line.
    if (Math.hypot(pt.x - last.x, pt.y - last.y) < 1.5) return;
    this.freehand.rawPoints.push(pt);
    this.freehand.lastPoint = pt;
    this.freehand.previewEl.setAttribute('d', this.freehand.previewEl.getAttribute('d') + ` L ${pt.x} ${pt.y}`);
  }

  /** Finalizes the in-progress stroke into a real element — same
   *  create-node/register/history/select shape as index.html's addElement()
   *  and duplicateSelected() above, just building `data` directly instead
   *  of via makeDefaultElement() (which has no notion of a drawn path). */
  _finishFreehand() {
    const { rawPoints, previewEl } = this.freehand;
    previewEl.remove();
    this.freehand = null;

    // Too short to be a real stroke (a stray click, or an accidental tap) —
    // discard rather than create a zero-size element.
    if (rawPoints.length < 2) return;
    const xs = rawPoints.map((p) => p.x), ys = rawPoints.map((p) => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    if (maxX - minX < 4 && maxY - minY < 4) return;
    const width = Math.max(4, maxX - minX);
    const height = Math.max(4, maxY - minY);

    // Epsilon in SVG user-space units — tuned to remove mouse jitter
    // without flattening intentional shape (a small loop, a sharp corner).
    const simplified = simplifyPoints(rawPoints, 2.5);
    const points = simplified.map((p) => ({ x: (p.x - minX) / width, y: (p.y - minY) / height }));

    const id = 'el-' + Date.now();
    const schema = ELEMENT_TYPES.draw;
    const data = { id, type: 'draw', x: minX, y: minY, width, height, name: schema.label, points };
    Object.entries(schema.fields).forEach(([key, field]) => { data[key] = field.default; });

    if (this.history) this.history.beginAction();
    const node = createElementNode(data);
    const layer = this.svg.querySelector('#elements-layer');
    layer.appendChild(node.group);
    gsap.to(node.group, { opacity: 1, duration: 0.3 });
    this.elements[id] = data;
    this.nodes[id] = node;
    this.registerNode(node);
    if (this.history) this.history.commitAction();
    this.onChange({ addedId: id });
    this.select(id); // straight into editing, same as every other "add element" path
  }

  /** Re-renders handles and re-fires onSelect (which index.html uses to
   *  refresh the property panel's fields) for whatever's currently
   *  selected — for external callers (like History.setState after an
   *  undo/redo) that changed element data without going through the
   *  editor's own drag/field-edit paths. No-op if nothing is selected. */
  refreshSelection() {
    if (this.selectedIds.size === 0) return;
    this._renderHandles();
    this.onSelect([...this.selectedIds]);
  }

  /** Starts a rubber-band selection drag from a pointerdown on empty
   *  canvas. Resolved on pointerup: if the pointer barely moved, it's
   *  treated as a plain click (deselect); otherwise every element whose
   *  bounding box overlaps the dragged rectangle gets selected. */
  _startMarquee(e) {
    const additive = e.shiftKey || e.metaKey || e.ctrlKey;
    const startSVG = screenToSVGPoint(this.svg, e.clientX, e.clientY);
    this.marqueeDrag = { startSVG, additive, moved: false };
    if (!this._marqueeRect) {
      this._marqueeRect = document.createElementNS(svgNS, 'rect');
      this._marqueeRect.setAttribute('fill', 'rgba(12,94,130,0.1)');
      this._marqueeRect.setAttribute('stroke', '#0C5E82');
      this._marqueeRect.setAttribute('stroke-width', 1);
      this._marqueeRect.setAttribute('stroke-dasharray', '4 3');
      this._marqueeRect.setAttribute('pointer-events', 'none');
      this._marqueeRect.style.display = 'none';
      this.svg.appendChild(this._marqueeRect);
    }
  }

  _updateMarquee(e) {
    const pt = screenToSVGPoint(this.svg, e.clientX, e.clientY);
    const start = this.marqueeDrag.startSVG;
    const x = Math.min(pt.x, start.x);
    const y = Math.min(pt.y, start.y);
    const w = Math.abs(pt.x - start.x);
    const h = Math.abs(pt.y - start.y);
    if (w > 2 || h > 2) this.marqueeDrag.moved = true;
    this._marqueeRect.setAttribute('x', x);
    this._marqueeRect.setAttribute('y', y);
    this._marqueeRect.setAttribute('width', w);
    this._marqueeRect.setAttribute('height', h);
    this._marqueeRect.style.display = '';
  }

  _finishMarquee() {
    const { additive, moved } = this.marqueeDrag;
    this._marqueeRect.style.display = 'none';

    if (!moved) {
      // No real drag happened — this was just a click on empty canvas.
      if (!additive) this.deselect();
      this.marqueeDrag = null;
      return;
    }

    const mx = parseFloat(this._marqueeRect.getAttribute('x'));
    const my = parseFloat(this._marqueeRect.getAttribute('y'));
    const mw = parseFloat(this._marqueeRect.getAttribute('width'));
    const mh = parseFloat(this._marqueeRect.getAttribute('height'));

    const hits = Object.keys(this.elements).filter((id) => {
      const box = this._getAbsoluteBBox(id);
      return !(box.x > mx + mw || box.x + box.width < mx || box.y > my + mh || box.y + box.height < my);
    });

    if (!additive) this.selectedIds.clear();
    hits.forEach((id) => this.selectedIds.add(id));
    this._renderHandles();
    this.onSelect([...this.selectedIds]);
    this.marqueeDrag = null;
  }

  /** Bounding box in absolute (SVG user-space) coordinates — _getLocalBBox
   *  is relative to the element's own group, which is what the marquee
   *  hit-test needs converted into the same space the marquee rect lives in. */
  _getAbsoluteBBox(id) {
    const data = this.elements[id];
    const local = this._getLocalBBox(data);
    return { x: data.x + local.x, y: data.y + local.y, width: local.width, height: local.height };
  }

  _startDrag(e, info) {
    if (this.history) this.history.beginAction();
    const svgPt = screenToSVGPoint(this.svg, e.clientX, e.clientY);
    const data = this.elements[info.id];
    this.drag = {
      ...info,
      startSVG: svgPt,
      startData: { x: data.x, y: data.y, width: data.width, height: data.height,
                   length: data.length, angle: data.angle },
      // For a multi-select move, every selected element's starting
      // position — moved together as a rigid group, all snapping in sync
      // with whichever one was actually grabbed.
      multiStart: (info.type === 'move' && this.selectedIds.size > 1)
        ? [...this.selectedIds].map((sid) => ({ id: sid, x: this.elements[sid].x, y: this.elements[sid].y }))
        : null,
    };
  }

  _onPointerMove(e) {
    if (this.freehand) { this._updateFreehand(e); return; }
    if (this.guideDrag) { this._updateGuideDrag(e); return; }
    if (this.marqueeDrag) { this._updateMarquee(e); return; }
    if (!this.drag) return;
    const data = this.elements[this.drag.id];
    const node = this.nodes[this.drag.id];
    const svgPt = screenToSVGPoint(this.svg, e.clientX, e.clientY);
    const dx = svgPt.x - this.drag.startSVG.x;
    const dy = svgPt.y - this.drag.startSVG.y;

    if (this.drag.narrowCandidate && (Math.abs(dx) > 2 || Math.abs(dy) > 2)) {
      // Real movement happened — this is a genuine drag of the group, not
      // a plain click, so don't narrow the selection down on release.
      this.drag.narrowCandidate = null;
    }

    // Shift while moving locks the drag to whichever axis has moved
    // further from the drag's start point — horizontal-only or
    // vertical-only, decided fresh each frame so crossing the diagonal
    // partway through a drag can still flip which axis is locked.
    let moveDx = dx, moveDy = dy;
    if (this.drag.type === 'move' && e.shiftKey) {
      if (Math.abs(dx) >= Math.abs(dy)) moveDy = 0;
      else moveDx = 0;
    }

    if (this.drag.type === 'move' && this.drag.multiStart) {
      // Snap the grabbed element's new position (guide-snap first, falling
      // back to grid-snap — see _resolveMoveSnap), derive the actual delta
      // that resulted, then apply that SAME delta to everything else
      // selected — keeps the group's relative layout intact rather than
      // snapping each element to the grid independently.
      const anchor = this.drag.multiStart.find((m) => m.id === this.drag.id);
      const { x: snappedX, y: snappedY } = this._resolveMoveSnap(data, anchor.x + moveDx, anchor.y + moveDy);
      const appliedDx = snappedX - anchor.x;
      const appliedDy = snappedY - anchor.y;
      this.drag.multiStart.forEach((m) => {
        const d = this.elements[m.id];
        if (!d) return;
        d.x = m.x + appliedDx;
        d.y = m.y + appliedDy;
        updateElementNode(this.nodes[m.id], d, { animate: false });
      });
      this._renderHandles();
      this.onChange({});
      return;
    }

    if (this.drag.type === 'move') {
      const snapped = this._resolveMoveSnap(data, this.drag.startData.x + moveDx, this.drag.startData.y + moveDy);
      data.x = snapped.x;
      data.y = snapped.y;
    } else if (this.drag.type === 'resize') {
      this._applyResize(data, dx, dy, this.drag.corner);
    } else if (this.drag.type === 'arrow-tip') {
      // Dragging the arrowhead directly sets length+angle from the vector,
      // rather than requiring two separate numeric edits.
      const vx = this.drag.startData.x2 + dx;
      const vy = this.drag.startData.y2 + dy;
      data.length = Math.round(Math.max(10, Math.hypot(vx, vy)));
      let deg = Math.atan2(vx, -vy) * 180 / Math.PI; // inverse of applyArrowStyle's angle math
      if (deg < 0) deg += 360;
      data.angle = Math.round(deg);
    }

    updateElementNode(node, data, { animate: false });
    this._renderHandles(); // handle positions track width/height/length changes
    this.onChange(data); // index.html's onChange syncs the property panel's fields from this
  }

  _onPointerUp() {
    if (this.freehand) { this._finishFreehand(); return; }
    if (this.guideDrag) { this._finishGuideDrag(); return; }
    if (this.marqueeDrag) { this._finishMarquee(); return; }
    if (!this.drag) return;
    const narrowTo = this.drag.narrowCandidate;
    if (this.history) this.history.commitAction();
    this.drag = null;
    if (this._activeSnapGuideIds.size > 0) { this._activeSnapGuideIds = new Set(); this.renderGuides(); } // clear the live snap highlight
    if (narrowTo) this.select(narrowTo); // was a plain click on a multi-selected element, no real drag — narrow to just this one
  }

  /** Rounds to whole numbers always, and additionally to the nearest grid
   *  increment when snap-to-grid is on (a project-wide canvas setting). */
  _snap(value) {
    const cs = this.getCanvasSettings();
    if (cs && cs.snapToGrid) {
      const g = cs.gridSize || 20;
      return Math.round(value / g) * g;
    }
    return Math.round(value);
  }

  _applyResize(data, dx, dy, corner) {
    const s = this.drag.startData;
    if (corner === 'right') { // text's single width handle
      data.width = this._snap(Math.max(50, s.width + dx));
      return;
    }
    let newX = s.x, newY = s.y, newW = s.width, newH = s.height;
    if (corner.includes('right')) newW = Math.max(20, s.width + dx);
    if (corner.includes('left'))  { newW = Math.max(20, s.width - dx); newX = s.x + dx; }
    if (corner.includes('bottom')) newH = Math.max(20, s.height + dy);
    if (corner.includes('top'))    { newH = Math.max(20, s.height - dy); newY = s.y + dy; }
    data.x = this._snap(newX); data.y = this._snap(newY);
    data.width = this._snap(newW); data.height = this._snap(newH);
  }

  /* ---- Ruler guides ----
     Persistent (project-wide, not per-slide) vertical/horizontal lines an
     author places to line elements up against — see defaultGuides() in
     slide-manager.js for the data shape and defaultsRationale. Scoped
     deliberately to MOVE-drags only: an element's edges/center can snap
     to a guide while being dragged into position, but resize handles
     don't (grid-snap is all resize gets, same as before this feature) —
     a smaller, well-defined slice of "snap to guides" rather than trying
     to cover every drag interaction in one pass. */

  /** Resolves a proposed top-left (rawX, rawY) for `data` into the actual
   *  position used this move-drag frame: guide-snap wins per-axis when
   *  within threshold (see _snapToGuides), grid-snap (or plain rounding)
   *  covers whichever axis didn't snap to a guide. Works in the element's
   *  LOCAL bbox space (via _getLocalBBox) rather than assuming (x,y,width,
   *  height) directly describes the box, so it's correct for arrows too
   *  (whose visual box can extend up/left of their own x,y origin).
   *  Also updates _activeSnapGuideIds and re-renders guides, but only
   *  when the engaged set actually changed — not every single frame. */
  _resolveMoveSnap(data, rawX, rawY) {
    const local = this._getLocalBBox(data);
    const guideSnap = this._snapToGuides(rawX + local.x, rawY + local.y, local.width, local.height);
    const x = guideSnap.x !== null ? Math.round(guideSnap.x - local.x) : this._snap(rawX);
    const y = guideSnap.y !== null ? Math.round(guideSnap.y - local.y) : this._snap(rawY);

    const nextIds = new Set(guideSnap.snappedIds);
    const changed = nextIds.size !== this._activeSnapGuideIds.size || [...nextIds].some((id) => !this._activeSnapGuideIds.has(id));
    this._activeSnapGuideIds = nextIds;
    if (changed) this.renderGuides();

    return { x, y };
  }

  /** Checks a box's left/right/horizontal-center edges against vertical
   *  guides, and its top/bottom/vertical-center edges against horizontal
   *  guides — whichever candidate edge is CLOSEST to a guide, and within
   *  the on-screen snap threshold, wins that axis. Returns
   *  { x, y, snappedIds } — x/y are null on an axis with no guide close
   *  enough (caller falls back to grid-snap for that axis); snappedIds
   *  are the engaged guides' ids, prefixed 'h:'/'v:' since horizontal and
   *  vertical guides are separate id spaces. No-ops (all null) when
   *  guides are off, exactly like they don't render when off. */
  _snapToGuides(x, y, width, height) {
    const result = { x: null, y: null, snappedIds: [] };
    const cs = this.getCanvasSettings();
    const guides = cs && cs.guides;
    if (!guides || !guides.enabled) return result;
    const threshold = this._guideSnapThresholdSVG();

    let bestXDist = threshold, bestX = null, bestXId = null;
    [x, x + width / 2, x + width].forEach((edge) => {
      guides.vertical.forEach((g) => {
        const dist = Math.abs(edge - g.x);
        if (dist < bestXDist) { bestXDist = dist; bestX = g.x - (edge - x); bestXId = g.id; }
      });
    });
    if (bestX !== null) { result.x = bestX; result.snappedIds.push('v:' + bestXId); }

    let bestYDist = threshold, bestY = null, bestYId = null;
    [y, y + height / 2, y + height].forEach((edge) => {
      guides.horizontal.forEach((g) => {
        const dist = Math.abs(edge - g.y);
        if (dist < bestYDist) { bestYDist = dist; bestY = g.y - (edge - y); bestYId = g.id; }
      });
    });
    if (bestY !== null) { result.y = bestY; result.snappedIds.push('h:' + bestYId); }

    return result;
  }

  /** Converts the ~8-screen-pixel snap distance into SVG user-space units
   *  via the canvas's current on-screen scale — the same "never guess a
   *  scale factor manually" reasoning as screenToSVGPoint() at the top of
   *  this file, since the canvas can render at any zoom/size. */
  _guideSnapThresholdSVG() {
    const ctm = this.svg.getScreenCTM();
    const scale = (ctm && ctm.a) ? ctm.a : 1;
    return 8 / scale;
  }

  /** Adds a new guide at the canvas's own centre, selects it, and leaves
   *  it ready to drag into position — same "instant, editable placement"
   *  feel as adding any other element via the left rail. */
  addGuide(orientation) {
    const cs = this.getCanvasSettings();
    if (!cs || !cs.guides) return;
    const id = 'guide-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
    if (this.history) this.history.beginAction();
    if (orientation === 'horizontal') cs.guides.horizontal.push({ id, y: Math.round(cs.height / 2) });
    else cs.guides.vertical.push({ id, x: Math.round(cs.width / 2) });
    if (this.history) this.history.commitAction();
    this.selectedGuide = { orientation, id };
    this.renderGuides();
    this.onChange({});
    return id;
  }

  removeGuide(orientation, id) {
    const cs = this.getCanvasSettings();
    if (!cs || !cs.guides) return;
    if (this.history) this.history.beginAction();
    this._deleteGuideFromState(cs, orientation, id);
    if (this.history) this.history.commitAction();
  }

  /** The actual removal, with no history bracketing of its own — shared
   *  by removeGuide() (brackets itself) and _finishGuideDrag()'s "dropped
   *  outside the canvas" path (which reuses the begin() already opened by
   *  _startGuideDrag(), so the whole drag-then-delete collapses into ONE
   *  undo step that restores the guide to its PRE-drag position, not two
   *  separate steps). */
  _deleteGuideFromState(cs, orientation, id) {
    const list = orientation === 'horizontal' ? cs.guides.horizontal : cs.guides.vertical;
    const i = list.findIndex((g) => g.id === id);
    if (i === -1) return false;
    list.splice(i, 1);
    if (this.selectedGuide && this.selectedGuide.orientation === orientation && this.selectedGuide.id === id) this.selectedGuide = null;
    this.renderGuides();
    this.onChange({});
    return true;
  }

  /** Sets an existing guide's position directly — used by the Settings
   *  panel's numeric field, as an alternative to dragging it on the
   *  canvas. Not itself history-bracketed; callers (a field's focus/
   *  change handlers) bracket it the same way every other settings field
   *  already does. */
  setGuidePosition(orientation, id, value) {
    const cs = this.getCanvasSettings();
    if (!cs || !cs.guides) return;
    const list = orientation === 'horizontal' ? cs.guides.horizontal : cs.guides.vertical;
    const guide = list.find((g) => g.id === id);
    if (!guide) return;
    if (orientation === 'horizontal') guide.y = value; else guide.x = value;
    this.renderGuides();
    this.onChange({});
  }

  /** Flips the one enabled flag that gates both guide visibility AND
   *  snapping — wired to both the Settings panel switch and Shift+R. Not
   *  history-bracketed: this is a view/tool-mode preference, not project
   *  content, the same reasoning snapToGrid's own toggle already follows
   *  (bindSettingInput brackets it in history regardless, for consistency
   *  with every other settings field, but undoing it back and forth isn't
   *  meaningfully different from undoing any other minor setting). */
  toggleGuidesEnabled() {
    const cs = this.getCanvasSettings();
    if (!cs || !cs.guides) return;
    cs.guides.enabled = !cs.guides.enabled;
    if (!cs.guides.enabled) this.selectedGuide = null;
    this.renderGuides();
    this.onChange({});
  }

  /** Full rebuild of the guides <g> — same "destroy and recreate" idiom
   *  _renderHandles()/_clearHandles() already use, rather than diffing
   *  children. Always re-appended as the LAST child of the svg root, so
   *  guides paint on top of elements-layer (and its selection handles)
   *  regardless of what slide-switching/layer-reordering did to sibling
   *  order elsewhere. Hidden entirely (not just visually) while guides
   *  are off, so a hidden guide can never be clicked/dragged/snapped to —
   *  the single enabled flag really does mean "off", not "invisible". */
  renderGuides() {
    if (this.guidesLayer) { this.guidesLayer.remove(); this.guidesLayer = null; }
    const cs = this.getCanvasSettings();
    const guides = cs && cs.guides;
    if (!guides || !guides.enabled) return;

    const layer = document.createElementNS(svgNS, 'g');
    layer.setAttribute('id', 'guides-layer');
    this.svg.appendChild(layer);
    this.guidesLayer = layer;

    guides.horizontal.forEach((g) => this._renderOneGuide(layer, 'horizontal', g, cs));
    guides.vertical.forEach((g) => this._renderOneGuide(layer, 'vertical', g, cs));
  }

  _renderOneGuide(layer, orientation, guide, cs) {
    const selected = !!(this.selectedGuide && this.selectedGuide.orientation === orientation && this.selectedGuide.id === guide.id);
    const active = this._activeSnapGuideIds.has((orientation === 'horizontal' ? 'h:' : 'v:') + guide.id);
    const color = selected ? '#0C5E82' : (active ? '#FF7A00' : '#FF3EA5');
    const width = selected || active ? 2 : 1;

    const x1 = orientation === 'horizontal' ? 0 : guide.x;
    const y1 = orientation === 'horizontal' ? guide.y : 0;
    const x2 = orientation === 'horizontal' ? cs.width : guide.x;
    const y2 = orientation === 'horizontal' ? guide.y : cs.height;

    const visible = document.createElementNS(svgNS, 'line');
    visible.setAttribute('x1', x1); visible.setAttribute('y1', y1);
    visible.setAttribute('x2', x2); visible.setAttribute('y2', y2);
    visible.setAttribute('stroke', color);
    visible.setAttribute('stroke-width', width);
    visible.setAttribute('pointer-events', 'none');
    layer.appendChild(visible);

    // A wider, invisible-but-still-hit-testable line on top of the thin
    // visible one — a 1-2px line is nearly impossible to grab precisely
    // with a mouse otherwise. stroke-opacity:0 (rather than stroke:none)
    // keeps it hit-testable via pointer-events:stroke.
    const hit = document.createElementNS(svgNS, 'line');
    hit.setAttribute('x1', x1); hit.setAttribute('y1', y1);
    hit.setAttribute('x2', x2); hit.setAttribute('y2', y2);
    hit.setAttribute('stroke', '#000');
    hit.setAttribute('stroke-opacity', 0);
    hit.setAttribute('stroke-width', 10);
    hit.setAttribute('pointer-events', 'stroke');
    hit.style.cursor = orientation === 'horizontal' ? 'ns-resize' : 'ew-resize';
    hit.addEventListener('pointerdown', (e) => {
      if (this.drawMode) return;
      e.stopPropagation();
      this.deselect(); // a guide and an element are never selected at once
      this.selectedGuide = { orientation, id: guide.id };
      this.renderGuides();
      this._startGuideDrag(e, orientation, guide.id);
    });
    layer.appendChild(hit);
  }

  _startGuideDrag(e, orientation, id) {
    if (this.history) this.history.beginAction();
    this.guideDrag = { orientation, id, lastClientX: e.clientX, lastClientY: e.clientY };
  }

  _updateGuideDrag(e) {
    const cs = this.getCanvasSettings();
    if (!cs || !cs.guides) return;
    this.guideDrag.lastClientX = e.clientX;
    this.guideDrag.lastClientY = e.clientY;
    const svgPt = screenToSVGPoint(this.svg, e.clientX, e.clientY);
    const list = this.guideDrag.orientation === 'horizontal' ? cs.guides.horizontal : cs.guides.vertical;
    const guide = list.find((g) => g.id === this.guideDrag.id);
    if (!guide) return;
    if (this.guideDrag.orientation === 'horizontal') guide.y = this._snap(svgPt.y);
    else guide.x = this._snap(svgPt.x);
    this.renderGuides();
    this.onChange({});
  }

  /** Dropping a guide outside the canvas's own on-screen bounds deletes
   *  it — the standard design-tool "drag a guide back off the ruler/
   *  canvas to remove it" gesture. Checked in SCREEN space (not SVG
   *  coordinates) so it means the same thing regardless of zoom: did the
   *  pointer end up visually outside the canvas. */
  _finishGuideDrag() {
    const { orientation, id, lastClientX, lastClientY } = this.guideDrag;
    this.guideDrag = null;
    const rect = this.svg.getBoundingClientRect();
    const outside = lastClientX < rect.left || lastClientX > rect.right || lastClientY < rect.top || lastClientY > rect.bottom;
    const cs = this.getCanvasSettings();
    if (outside && cs && cs.guides) this._deleteGuideFromState(cs, orientation, id);
    // One commitAction() covers the whole gesture — whether it ended in a
    // repositioned guide or (dropped outside the canvas) a deleted one —
    // matching the single beginAction() _startGuideDrag() already opened.
    if (this.history) this.history.commitAction();
  }

  /* ---- Selection outline + resize handles ---- */

  _clearHandles() {
    if (this.handleLayer) { this.handleLayer.remove(); this.handleLayer = null; }
    this._multiHandleLayers.forEach((l) => l.remove());
    this._multiHandleLayers = [];
  }

  _renderHandles() {
    this._clearHandles();
    if (this.selectedIds.size === 0) return;

    if (this.selectedIds.size > 1) {
      // Multi-select: a plain outline per selected element, no resize
      // handles — resizing several different-typed elements as one
      // operation isn't supported.
      this.selectedIds.forEach((id) => {
        const data = this.elements[id];
        const node = this.nodes[id];
        if (!data || !node) return;
        const box = this._getLocalBBox(data);
        const layer = document.createElementNS(svgNS, 'g');
        layer.setAttribute('class', 'selection-handles');
        node.group.appendChild(layer);
        const outline = document.createElementNS(svgNS, 'rect');
        outline.setAttribute('x', box.x); outline.setAttribute('y', box.y);
        outline.setAttribute('width', box.width); outline.setAttribute('height', box.height);
        outline.setAttribute('fill', 'none');
        outline.setAttribute('stroke', '#0C5E82');
        outline.setAttribute('stroke-width', 2);
        outline.setAttribute('stroke-dasharray', '4 3');
        outline.setAttribute('pointer-events', 'none');
        layer.appendChild(outline);
        this._multiHandleLayers.push(layer);
      });
      return;
    }

    const id = this.selectedId;
    const data = this.elements[id];
    const node = this.nodes[id];
    if (!data || !node) return;

    const layer = document.createElementNS(svgNS, 'g');
    layer.setAttribute('class', 'selection-handles');
    node.group.appendChild(layer); // child of the element's own group — inherits its x/y automatically
    this.handleLayer = layer;

    if (data.type === 'arrow') {
      const angleRad = (data.angle || 0) * Math.PI / 180;
      const x2 = (data.length || 200) * Math.sin(angleRad);
      const y2 = -(data.length || 200) * Math.cos(angleRad);
      this._addHandle(layer, x2, y2, (e) => {
        e.stopPropagation();
        this._startDrag(e, { type: 'arrow-tip', id });
        this.drag.startData.x2 = x2;
        this.drag.startData.y2 = y2;
      });
      return;
    }

    // Outline
    const outline = document.createElementNS(svgNS, 'rect');
    outline.setAttribute('x', 0); outline.setAttribute('y', 0);
    outline.setAttribute('width', data.width); outline.setAttribute('height', data.height);
    outline.setAttribute('fill', 'none');
    outline.setAttribute('stroke', '#0C5E82');
    outline.setAttribute('stroke-width', 2);
    outline.setAttribute('stroke-dasharray', '4 3');
    outline.setAttribute('pointer-events', 'none');
    layer.appendChild(outline);

    if (data.type === 'text') {
      // Width-only handle — height is auto-derived from content, not
      // something an author drags.
      this._addHandle(layer, data.width, data.height / 2, (e) => {
        e.stopPropagation();
        this._startDrag(e, { type: 'resize', id, corner: 'right' });
      });
    } else {
      [['top-left', 0, 0], ['top-right', data.width, 0],
       ['bottom-left', 0, data.height], ['bottom-right', data.width, data.height]]
        .forEach(([corner, hx, hy]) => {
          this._addHandle(layer, hx, hy, (e) => {
            e.stopPropagation();
            this._startDrag(e, { type: 'resize', id, corner });
          });
        });
    }
  }

  _addHandle(layer, x, y, onDown) {
    const h = document.createElementNS(svgNS, 'circle');
    h.setAttribute('cx', x); h.setAttribute('cy', y); h.setAttribute('r', 8);
    h.setAttribute('fill', '#fff');
    h.setAttribute('stroke', '#0C5E82');
    h.setAttribute('stroke-width', 2);
    h.style.cursor = 'pointer';
    h.addEventListener('pointerdown', onDown);
    layer.appendChild(h);
  }

  /* ---- Property field building (consumed by index.html's #property-panel) ---- */

  /** Builds one labeled input for a single-element selection, wired to
   *  read/write `data[key]` directly — history begin/commit on
   *  focus/change, updateElementNode + handle refresh on every input so
   *  the canvas tracks the field live. `data-field-key` is set so
   *  index.html's syncPropertyPanelFields() can push drag-derived changes
   *  (e.g. the text width handle) back into the open panel without a
   *  full re-render stealing focus mid-edit. */
  buildField(data, key, field) {
    const wrap = document.createElement('div');
    wrap.className = 'popup-field';
    const label = document.createElement('label');
    label.textContent = field.label;
    wrap.appendChild(label);

    let input;
    if (field.type === 'select') {
      input = document.createElement('select');
      field.options.forEach(([val, text]) => {
        const opt = document.createElement('option');
        opt.value = val; opt.textContent = text;
        if (val === data[key]) opt.selected = true;
        input.appendChild(opt);
      });
    } else if (field.type === 'color') {
      input = document.createElement('input'); input.type = 'color'; input.value = data[key];
    } else if (field.type === 'range' || field.type === 'number') {
      input = document.createElement('input');
      input.type = field.type === 'range' ? 'range' : 'number';
      if (field.min !== undefined) input.min = field.min;
      if (field.max !== undefined) input.max = field.max;
      if (field.step !== undefined) input.step = field.step;
      input.value = data[key];
    } else if (field.type === 'textarea') {
      input = document.createElement('textarea'); input.rows = 3; input.value = data[key];
    } else if (field.type === 'iconpicker') {
      input = document.createElement('select');
      Object.keys(ICON_PATHS).forEach((name) => {
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name;
        if (name === data[key]) opt.selected = true;
        input.appendChild(opt);
      });
    } else if (field.type === 'fontpicker') {
      input = document.createElement('select');
      Object.entries(FONT_FAMILIES).forEach(([fontKey, font]) => {
        const opt = document.createElement('option');
        opt.value = fontKey; opt.textContent = font.label;
        opt.style.fontFamily = font.css; // previews each choice in its own font
        if (fontKey === data[key]) opt.selected = true;
        input.appendChild(opt);
      });
    }
    input.dataset.fieldKey = key;

    input.addEventListener('focus', () => {
      if (this.history) this.history.beginAction();
    });
    input.addEventListener('input', () => {
      let val = input.value;
      if (field.type === 'number' || field.type === 'range') val = parseFloat(val);
      data[key] = val;
      updateElementNode(this.nodes[this.selectedId], data, { animate: false });
      this._renderHandles(); // width/height may have changed (e.g. text width)
      this.onChange(data);
    });
    input.addEventListener('change', () => {
      if (this.history) this.history.commitAction();
    });

    wrap.appendChild(input);
    return wrap;
  }

  /** Applies a single field's value to every currently-selected element
   *  that has it — the multi-select panel's "edit once, apply to all"
   *  behavior for fields shared across the selected types (colour,
   *  opacity, etc.). Elements missing the field (shouldn't happen, since
   *  callers only offer fields common to every selected type) are
   *  skipped rather than gaining a stray key. */
  setFieldOnSelection(key, value) {
    this.selectedIds.forEach((id) => {
      const data = this.elements[id];
      if (!data || !(key in data)) return;
      data[key] = value;
      updateElementNode(this.nodes[id], data, { animate: false });
    });
    this._renderHandles();
    this.onChange({});
  }
}


</script>
