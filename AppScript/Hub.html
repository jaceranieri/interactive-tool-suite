<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base target="_top">
<title>Interactive Tool Suite</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; }
  body { padding: var(--space-8); display: flex; flex-direction: column; }
  .hub-header { max-width: 1200px; width: 100%; margin: 0 auto var(--space-6); }
  .hub-header .title-block { margin-bottom: var(--space-2); }
  .hub-header h1 { font-size: var(--text-2xl); margin: 0 0 var(--space-2); }
  .hub-header p { color: var(--ink-soft); margin: 0; }

  .hub-layout {
    max-width: 1200px; width: 100%; margin: 0 auto; flex: 1;
    display: grid; grid-template-columns: 300px 1fr; gap: var(--space-5);
    min-height: 0;
  }

  /* ---- Left: tool list ---- */
  .hub-list {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm); overflow-y: auto; padding: var(--space-2);
  }
  .hub-list-item {
    display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
    border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-bottom: 2px;
    color: inherit; font-family: inherit; transition: background var(--duration-fast) var(--ease-standard);
  }
  .hub-list-item:hover { background: var(--surface-sunken); }
  .hub-list-item.active { background: var(--accent-soft); }
  .hub-list-item-row { display: flex; align-items: flex-start; gap: var(--space-3); }
  /* Every tool gets an icon badge — makes each row scannable/distinct at
     a glance instead of relying on title text alone. */
  .hub-tool-icon {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: var(--radius-md);
    background: var(--accent-soft); color: var(--accent-ink); font-size: 15px;
  }
  .hub-list-item-body { min-width: 0; flex: 1; }
  .hub-list-item-top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); }
  .hub-list-item h3 { margin: 0; font-size: var(--text-base); font-weight: 600; }
  .hub-list-item p {
    color: var(--ink-soft); font-size: var(--text-sm); margin: var(--space-1) 0 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .status-pill.beta { background: var(--warn-soft); color: #7A5210; }
  .status-pill.beta .dot { background: var(--warn); }

  /* ---- Right: detail + preview ---- */
  .hub-detail {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm); padding: var(--space-5); display: flex; flex-direction: column;
    gap: var(--space-4); min-height: 0; min-width: 0;
  }
  .hub-detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-4); }
  .hub-detail-heading-group { min-width: 0; flex: 1; }
  .hub-detail-title-row { display: flex; align-items: center; gap: var(--space-3); }
  .hub-detail-icon {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; border-radius: var(--radius-md);
    background: var(--accent-soft); color: var(--accent-ink); font-size: 22px;
  }
  .hub-detail-header h2 { margin: 0; font-size: var(--text-xl); }
  .hub-detail-header p { color: var(--ink-soft); margin: var(--space-2) 0 0; max-width: 60ch; }
  .hub-detail-actions { flex-shrink: 0; }
  /* Open tool — the hub's one real call to action, sized and weighted to
     read as the primary thing to do on this page, not just another
     button. Reuses .btn/.btn-primary's base (padding, colors, the
     existing press-scale micro-animation) and layers size/emphasis on
     top rather than reinventing button styling from scratch. */
  .hub-cta-btn {
    padding: var(--space-3) var(--space-6); font-size: var(--text-base); font-weight: 700;
    border-radius: var(--radius-md); box-shadow: var(--shadow-md);
  }
  .hub-cta-btn:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }

  /* .hub-preview-frame is the flexible area that has whatever space is
     left; .hub-preview itself is the actual "viewport" — JS-sized (see
     fitViewportFrame) to always be a strict 4:3 rectangle that fits
     within the frame, letterboxed/centered rather than stretched to fill
     it. flex: none so its JS-assigned pixel width/height aren't fought
     by the frame's own flex layout. */
  .hub-preview-frame {
    flex: 1; min-height: 0; min-width: 0; display: flex;
    align-items: center; justify-content: center;
  }
  .hub-preview {
    flex: none; border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--surface-sunken); overflow: hidden; display: flex;
    align-items: center; justify-content: center;
    padding: var(--space-5); box-sizing: border-box;
  }
  /* The iframe renders the export at a fixed reference width (see
     PREVIEW_DESIGN_WIDTH in the script below), completely independent of
     the visible box's actual size — .hub-preview-sizer is then set to
     the SCALED display footprint (so it lays out/centers correctly) and
     .hub-preview-scale-wrap (the iframe's actual full-size box) is
     CSS-transform-scaled down (or up) to fit inside it. This guarantees
     the whole export — canvas AND nav bar — is visible with no internal
     scrollbar, at any panel size, since the scale factor is derived from
     the export's own real measured content height rather than guessed. */
  .hub-preview-sizer { overflow: hidden; min-width: 0; min-height: 0; }
  .hub-preview-scale-wrap { transform-origin: top left; }
  .hub-preview-scale-wrap iframe {
    display: block; border: none; border-radius: var(--radius-sm); background: var(--surface);
  }
  .hub-preview-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); font-size: var(--text-sm); text-align: center; padding: var(--space-6);
  }

  /* ---- Update notes — beneath the viewport, hand-maintained per tool
     via PAGES's `updates` array (see Code.gs). Capped height + its own
     scroll so a long changelog never pushes the preview viewport down
     instead of just scrolling in place. */
  .hub-updates {
    flex-shrink: 0; border-top: 1px solid var(--border); padding-top: var(--space-4);
    max-height: 150px; overflow-y: auto;
  }
  .hub-updates h3 {
    margin: 0 0 var(--space-2); font-size: var(--text-xs); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft);
  }
  .hub-updates ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: var(--space-2); }
  .hub-updates li { font-size: var(--text-sm); color: var(--ink); }
  .hub-updates-empty { font-size: var(--text-sm); color: var(--ink-soft); margin: 0; }

  @media (max-width: 760px) {
    .hub-layout { grid-template-columns: 1fr; }
    .hub-list { max-height: 260px; }
  }
</style>
</head>
<body>

  <div class="hub-header">
    <div class="title-block">Authoring Tools</div>
    <h1>Interactive Tool Suite</h1>
    <p>Choose the right tool for the interactive you're building.</p>
  </div>

  <div class="hub-layout">
    <div class="hub-list" id="hub-list"></div>
    <div class="hub-detail">
      <div class="hub-detail-header">
        <div class="hub-detail-heading-group">
          <div class="hub-detail-title-row">
            <div class="hub-tool-icon hub-detail-icon" id="hub-detail-icon"></div>
            <div>
              <div class="title-block" id="hub-detail-status"></div>
              <h2 id="hub-detail-title"></h2>
            </div>
          </div>
          <p id="hub-detail-description"></p>
        </div>
        <div class="hub-detail-actions">
          <a class="btn btn-primary hub-cta-btn" id="hub-detail-open">Open tool</a>
        </div>
      </div>
      <div class="hub-preview-frame" id="hub-preview-frame">
        <div class="hub-preview" id="hub-preview"></div>
      </div>
      <div class="hub-updates" id="hub-updates"></div>
    </div>
  </div>

  <script>
    const tools = <?!= toolsJson ?>;
    const baseUrl = <?!= JSON.stringify(baseUrl) ?>;

    let selectedId = tools.length ? tools[0].id : null;

    // Reference width the preview export renders at internally — fixed,
    // regardless of the visible panel's actual size. Keeping it fixed
    // means a window resize only ever needs a cheap CSS transform-scale
    // recalculation (see rescaleActivePreview), never a re-measurement of
    // the export's own layout.
    const PREVIEW_DESIGN_WIDTH = 1000;

    // The viewport "window" itself is always this shape (see
    // fitViewportFrame) — independent of whatever aspect ratio a given
    // tool's own export canvas happens to be.
    const VIEWPORT_RATIO = 4 / 3;

    // Fallback for a future tool added to PAGES without an `icon` yet.
    const DEFAULT_ICON = 'fa-diagram-project';

    function statusBadge(tool) {
      return tool.status === 'beta'
        ? '<span class="status-pill beta"><span class="dot"></span>Beta</span>'
        : '';
    }

    function renderList() {
      const list = document.getElementById('hub-list');
      list.innerHTML = '';
      tools.forEach((tool) => {
        const btn = document.createElement('button');
        btn.className = 'hub-list-item' + (tool.id === selectedId ? ' active' : '');
        btn.innerHTML = `
          <div class="hub-list-item-row">
            <div class="hub-tool-icon"><i class="fa-solid ${tool.icon || DEFAULT_ICON}"></i></div>
            <div class="hub-list-item-body">
              <div class="hub-list-item-top">
                <h3></h3>
                ${statusBadge(tool)}
              </div>
              <p></p>
            </div>
          </div>
        `;
        btn.querySelector('h3').textContent = tool.title;
        btn.querySelector('p').textContent = tool.description || '';
        btn.addEventListener('click', () => selectTool(tool.id));
        list.appendChild(btn);
      });
    }

    function renderDetail() {
      const tool = tools.find((t) => t.id === selectedId);
      const preview = document.getElementById('hub-preview');
      preview.innerHTML = '';

      if (!tool) {
        document.getElementById('hub-detail-icon').innerHTML = '';
        document.getElementById('hub-detail-status').innerHTML = '';
        document.getElementById('hub-detail-title').textContent = '';
        document.getElementById('hub-detail-description').textContent = '';
        document.getElementById('hub-detail-open').style.display = 'none';
        document.getElementById('hub-updates').innerHTML = '';
        return;
      }

      document.getElementById('hub-detail-icon').innerHTML = `<i class="fa-solid ${tool.icon || DEFAULT_ICON}"></i>`;
      document.getElementById('hub-detail-status').innerHTML = statusBadge(tool);
      document.getElementById('hub-detail-title').textContent = tool.title;
      document.getElementById('hub-detail-description').textContent = tool.description || '';
      const openLink = document.getElementById('hub-detail-open');
      openLink.style.display = '';
      openLink.href = baseUrl + '?page=' + tool.id;
      openLink.innerHTML = 'Open tool <i class="fa-solid fa-arrow-right"></i>';

      // Update notes first — it's a flex sibling of the preview frame, so
      // its final height has to be in place BEFORE measuring the frame's
      // available space below. Sizing the viewport first (against a
      // still-empty, zero-height updates panel) would compute a box too
      // large, only for updates content to then shrink the frame's real
      // available space out from under an already-fixed-size viewport —
      // exactly the overlap bug this order avoids.
      renderUpdates(tool);

      // Size the 4:3 viewport window to the available frame BEFORE
      // mounting content into it, so the iframe fit logic below measures
      // against the final box instead of a stale one.
      fitViewportFrame();

      if (tool.previewHtml) {
        // A fresh iframe per tool switch — only the selected tool's
        // preview is ever mounted, so switching tools tears down the
        // previous one instead of keeping multiple live iframes around.
        mountPreviewIframe(tool, preview);
      } else {
        const empty = document.createElement('div');
        empty.className = 'hub-preview-empty';
        empty.textContent = 'Preview not available yet.';
        preview.appendChild(empty);
      }
    }

    /** Sizes #hub-preview to the largest 4:3 box that fits inside
     *  #hub-preview-frame's current available space — a classic
     *  letterbox fit, computed the same way regardless of which
     *  dimension is the tighter constraint. Pure layout math, no
     *  re-measurement of preview content, so a window resize can call
     *  this directly. */
    function fitViewportFrame() {
      const frame = document.getElementById('hub-preview-frame');
      const viewport = document.getElementById('hub-preview');
      const availW = frame.clientWidth;
      const availH = frame.clientHeight;
      if (!availW || !availH) return;

      let w, h;
      if (availW / availH > VIEWPORT_RATIO) {
        h = availH;
        w = h * VIEWPORT_RATIO;
      } else {
        w = availW;
        h = w / VIEWPORT_RATIO;
      }
      viewport.style.width = Math.round(w) + 'px';
      viewport.style.height = Math.round(h) + 'px';
    }

    function renderUpdates(tool) {
      const el = document.getElementById('hub-updates');
      el.innerHTML = '';
      const heading = document.createElement('h3');
      heading.textContent = "What's new";
      el.appendChild(heading);

      if (tool.updates && tool.updates.length) {
        const ul = document.createElement('ul');
        tool.updates.forEach((note) => {
          const li = document.createElement('li');
          li.textContent = note;
          ul.appendChild(li);
        });
        el.appendChild(ul);
      } else {
        const empty = document.createElement('p');
        empty.className = 'hub-updates-empty';
        empty.textContent = 'No update notes yet.';
        el.appendChild(empty);
      }
    }

    /** Builds the sizer/scale-wrap/iframe structure (see the CSS comment
     *  above .hub-preview-sizer) and, once the export has actually
     *  loaded, measures its true content size and scales it to fit. */
    function mountPreviewIframe(tool, container) {
      const sizer = document.createElement('div');
      sizer.className = 'hub-preview-sizer';
      const wrap = document.createElement('div');
      wrap.className = 'hub-preview-scale-wrap';
      const iframe = document.createElement('iframe');
      iframe.title = tool.title + ' preview';
      // Hidden until sized, so switching tools never flashes a
      // wrong-size/scrolling frame before the fit calculation lands.
      iframe.style.visibility = 'hidden';
      iframe.style.width = PREVIEW_DESIGN_WIDTH + 'px';
      wrap.appendChild(iframe);
      sizer.appendChild(wrap);
      container.appendChild(sizer);

      iframe.addEventListener('load', () => {
        fitPreviewIframe(iframe, wrap, sizer);
        // Google Fonts (in a real deployment, reachable over the real
        // internet unlike local/sandboxed testing) can swap in and
        // reflow text slightly after the initial load event — re-measure
        // once more shortly after to correct for that.
        setTimeout(() => fitPreviewIframe(iframe, wrap, sizer), 400);
      });
      iframe.srcdoc = tool.previewHtml;
    }

    /** Measures the export's real (unscaled) content size at
     *  PREVIEW_DESIGN_WIDTH, sizes the iframe to exactly that (so it
     *  never scrolls internally), then scales the whole wrap down/up via
     *  applyPreviewScale so it fits the visible box with nothing cut
     *  off — the canvas AND the nav bar, no vertical or horizontal
     *  scrollbar. */
    function fitPreviewIframe(iframe, wrap, sizer) {
      let contentHeight;
      try {
        contentHeight = iframe.contentDocument.documentElement.scrollHeight;
      } catch (err) {
        return; // shouldn't happen for a same-document srcdoc iframe
      }
      if (!contentHeight) return;

      iframe.style.height = contentHeight + 'px';
      wrap.dataset.designHeight = contentHeight;
      iframe.style.visibility = '';
      applyPreviewScale(wrap, sizer);
    }

    /** Pure CSS-transform recalculation — no re-measurement of the
     *  export's own content — so a window resize can call this directly. */
    function applyPreviewScale(wrap, sizer) {
      const designHeight = Number(wrap.dataset.designHeight);
      if (!designHeight) return;

      // .hub-preview's own padding has to come out of its box before it's
      // "available space" for the sizer — clientWidth/clientHeight include
      // padding, so subtract it explicitly. Using the raw border-box size
      // here previously overshot by exactly that padding, which the flex
      // layout then silently resolved by shrinking (and clipping, since
      // the sizer has overflow: hidden) the sizer below its assigned
      // width instead of erroring — the bug looked like nothing was
      // wrong until you measured actual vs. requested pixel widths.
      const previewEl = sizer.parentElement;
      const previewStyle = getComputedStyle(previewEl);
      const availW = previewEl.clientWidth - parseFloat(previewStyle.paddingLeft) - parseFloat(previewStyle.paddingRight);
      const availH = previewEl.clientHeight - parseFloat(previewStyle.paddingTop) - parseFloat(previewStyle.paddingBottom);
      const scale = Math.min(availW / PREVIEW_DESIGN_WIDTH, availH / designHeight);

      wrap.style.width = PREVIEW_DESIGN_WIDTH + 'px';
      wrap.style.height = designHeight + 'px';
      wrap.style.transform = 'scale(' + scale + ')';
      sizer.style.width = Math.round(PREVIEW_DESIGN_WIDTH * scale) + 'px';
      sizer.style.height = Math.round(designHeight * scale) + 'px';
    }

    function rescaleActivePreview() {
      // The 4:3 window's own size depends on the frame's available
      // space, which a resize just changed — refit it first so the
      // iframe-content scale (which reads the window's now-current size)
      // isn't computed against a stale box.
      fitViewportFrame();
      const sizer = document.querySelector('.hub-preview-sizer');
      const wrap = sizer && sizer.querySelector('.hub-preview-scale-wrap');
      if (sizer && wrap) applyPreviewScale(wrap, sizer);
    }

    function selectTool(id) {
      if (id === selectedId) return;
      selectedId = id;
      renderList();
      renderDetail();
    }

    window.addEventListener('resize', rescaleActivePreview);

    renderList();
    renderDetail();
  </script>

</body>
</html>
