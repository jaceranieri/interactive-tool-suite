<script>
/* ==========================================================================
   Toggle Slides — Layer Panel
   Lists every element on the one canvas in stacking order (top of the
   list = top of the stack — display convention only, the reverse of the
   underlying array order). Click a row to select it (Shift/Cmd/Ctrl+click
   to add to the selection); drag a row to reorder, or use the up/down
   buttons for the same thing one step at a time.

   Same "always reads directly from the manager, never keeps its own
   copy" rule as v2's layer-panel.js — call renderLayerPanel() again any
   time content, order, or selection changes and it fully redraws.

   ONE REAL DIFFERENCE FROM v2's VERSION: v2 shows a link icon when an
   element's id is shared with another slide (the cross-slide "linking"
   mechanic this tool has no equivalent of, since there's only one
   canvas). This shows which toggle button(s) currently claim the element
   instead — a small pill per owning button, or nothing at all for an
   element with no button assigned (meaning: always visible).
   ========================================================================== */

function renderLayerPanel(container, toggleManager, canvasEditor) {
  container.innerHTML = '';
  const order = toggleManager.getLayerOrder();
  const topToBottom = [...order].reverse(); // display convention: top of list = top of stack

  if (topToBottom.length === 0) {
    container.innerHTML = '<div class="layer-empty">No elements on the canvas yet.</div>';
    return;
  }

  let draggedId = null;

  topToBottom.forEach((id) => {
    const data = toggleManager.elements[id];
    if (!data) return;
    const schema = ELEMENT_TYPES[data.type];

    const row = document.createElement('div');
    row.className = 'layer-row' + (canvasEditor.selectedIds.has(id) ? ' active' : '');
    row.draggable = true;

    const icon = document.createElement('i');
    icon.className = 'fa-solid ' + (schema.icon || 'fa-shapes');
    row.appendChild(icon);

    const label = document.createElement('span');
    label.className = 'layer-name';
    label.textContent = data.name || schema.label;
    row.appendChild(label);

    const owners = toggleManager.buttonsForElement(id);
    if (owners.length) {
      const badge = document.createElement('span');
      badge.className = 'layer-button-badge';
      badge.textContent = owners.map((b) => b.label).join(', ');
      badge.title = 'Shown when ' + (owners.length > 1 ? 'any of: ' : '') + owners.map((b) => b.label).join(', ') + ' is pressed';
      row.appendChild(badge);
    }

    const controls = document.createElement('span');
    controls.className = 'layer-controls';

    const upBtn = document.createElement('button');
    upBtn.innerHTML = '<i class="fa-solid fa-chevron-up"></i>';
    upBtn.title = 'Bring forward';
    upBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleManager.reorderLayer(id, -1); // -1 in array order = later = on top = "up" in the displayed list
      renderLayerPanel(container, toggleManager, canvasEditor);
    });

    const downBtn = document.createElement('button');
    downBtn.innerHTML = '<i class="fa-solid fa-chevron-down"></i>';
    downBtn.title = 'Send backward';
    downBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleManager.reorderLayer(id, 1);
      renderLayerPanel(container, toggleManager, canvasEditor);
    });

    controls.appendChild(upBtn);
    controls.appendChild(downBtn);
    row.appendChild(controls);

    row.addEventListener('click', (e) => {
      const additive = e.shiftKey || e.metaKey || e.ctrlKey;
      if (additive && canvasEditor.selectedIds.has(id)) {
        canvasEditor.selectedIds.delete(id);
        canvasEditor._renderHandles();
        canvasEditor._renderPopup();
        canvasEditor.onSelect([...canvasEditor.selectedIds]);
        renderLayerPanel(container, toggleManager, canvasEditor);
        return;
      }
      canvasEditor.select(id, { additive });
      renderLayerPanel(container, toggleManager, canvasEditor);
    });

    row.addEventListener('dragstart', (e) => {
      draggedId = id;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      container.querySelectorAll('.layer-row').forEach((r) => r.classList.remove('drag-over'));
    });
    row.addEventListener('dragover', (e) => {
      e.preventDefault(); // required for drop to fire at all
      if (draggedId && draggedId !== id) row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      row.classList.remove('drag-over');
      if (!draggedId || draggedId === id) return;
      // Dropping onto a row puts the dragged layer immediately above it
      // in the displayed (top-to-bottom) list.
      toggleManager.moveLayerBefore(draggedId, id);
      renderLayerPanel(container, toggleManager, canvasEditor);
    });

    container.appendChild(row);
  });
}
</script>
