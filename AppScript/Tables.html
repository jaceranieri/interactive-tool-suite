, U: [], A: ['href', 'target', 'rel'], BR: [] };\n\nfunction sanitizeRichHtml(html) {\n  const scratch = document.createElement('div');\n  scratch.innerHTML = html || '';\n\n  (function walk(node) {\n    [...node.childNodes].forEach((child) => {\n      if (child.nodeType === Node.TEXT_NODE) return;\n      if (child.nodeType !== Node.ELEMENT_NODE || !(child.tagName in RICHTEXT_ALLOWED_TAGS)) {\n        // Unwrap disallowed elements (e.g. a pasted <div>/<span>) rather\n        // than dropping their text content.\n        while (child.firstChild) node.insertBefore(child.firstChild, child);\n        node.removeChild(child);\n        return;\n      }\n      const allowedAttrs = RICHTEXT_ALLOWED_TAGS[child.tagName];\n      [...child.attributes].forEach((attr) => {\n        if (!allowedAttrs.includes(attr.name)) child.removeAttribute(attr.name);\n      });\n      walk(child);\n    });\n  })(scratch);\n\n  return scratch.innerHTML;\n}\n\n/**\n * Wires a toolbar + contenteditable pair for one richtext field.\n * @param root      container element; gets `.tbl-richtext-toolbar` and\n *                  `.tbl-richtext-editable` children appended to it.\n * @param value     initial sanitized HTML string (or a plain old-shape\n *                  string — see file header).\n * @param inline    which marks to expose, e.g. ['bold','italic','link'].\n * @param onChange  called with the new sanitized HTML on every edit.\n */\nfunction attachRichTextField(root, { value = '', inline = [], onChange = () => {} }) {\n  root.innerHTML = '';\n  root.classList.add('tbl-richtext-field');\n\n  const MARK_BUTTONS = {\n    bold: { icon: 'fa-bold', command: 'bold' },\n    italic: { icon: 'fa-italic', command: 'italic' },\n    underline: { icon: 'fa-underline', command: 'underline' },\n    link: { icon: 'fa-link', command: 'link' }, // handled specially — see below\n  };\n\n  const toolbar = document.createElement('div');\n  toolbar.className = 'tbl-richtext-toolbar';\n  inline.forEach((mark) => {\n    const spec = MARK_BUTTONS[mark];\n    if (!spec) return;\n    const btn = document.createElement('button');\n    btn.type = 'button';\n    btn.className = 'tbl-richtext-btn';\n    btn.innerHTML = `<i class=\"fa-solid ${spec.icon}\"></i>`;\n    btn.addEventListener('mousedown', (e) => e.preventDefault()); // keep selection alive\n    btn.addEventListener('click', async () => {\n      editable.focus();\n      if (mark === 'link') {\n        // Shell.prompt() opens a modal, which steals focus to its own input\n        // — the browser clears the contenteditable's selection the moment\n        // that happens, so by the time the awaited promise resolves,\n        // execCommand('createLink') would have nothing selected to act on\n        // and silently do nothing. Save the range before awaiting, then\n        // restore it before calling execCommand — same fix as Tabbed\n        // Panels' richtext-editor.js, same underlying bug class.\n        const selection = window.getSelection();\n        const savedRange = selection.rangeCount > 0 ? selection.getRangeAt(0).cloneRange() : null;\n        const existing = document.queryCommandValue('createLink');\n        const url = await Shell.prompt('Enter a URL, or leave blank to remove the link.', existing || 'https://', { heading: 'Link' });\n        if (url === false) return;\n        editable.focus();\n        if (savedRange) {\n          selection.removeAllRanges();\n          selection.addRange(savedRange);\n        }\n        document.execCommand(url ? 'createLink' : 'unlink', false, url || undefined);\n      } else {\n        document.execCommand(spec.command, false, null);\n      }\n      commit();\n    });\n    toolbar.appendChild(btn);\n  });\n\n  const editable = document.createElement('div');\n  editable.className = 'tbl-richtext-editable';\n  editable.contentEditable = 'true';\n  editable.innerHTML = sanitizeRichHtml(value);\n\n  function commit() {\n    onChange(sanitizeRichHtml(editable.innerHTML));\n  }\n\n  editable.addEventListener('input', commit);\n  editable.addEventListener('paste', (e) => {\n    e.preventDefault();\n    const text = (e.clipboardData || window.clipboardData).getData('text/plain');\n    document.execCommand('insertText', false, text);\n  });\n\n  root.appendChild(toolbar);\n  root.appendChild(editable);\n  return editable;\n}\n",
    tableRenderer: "/* ==========================================================================\n   Tables — Table Renderer\n   Same role as Tabbed Panels' block-renderer.js: the one rendering path,\n   used UNMODIFIED by both the authoring canvas and the exported player.\n   Never make this authoring-aware — it only reads a plain table `data`\n   object (see table-types.js for its shape) plus an optional `opts` for\n   interaction hooks, and returns real DOM.\n\n   Depends on richtext-editor.js's sanitizeRichHtml() being loaded first\n   (cell text is sanitized again here at render time, regardless of\n   source — see table-types.js's header comment) — index.html's\n   <script src> order and the Export module list (fetchModuleSources())\n   both load richtext-editor.js alongside this file for that reason.\n\n   ---- Freeze + merged cells: the documented limitation ----\n   freezeHeader/freezeFirstCol use plain CSS `position: sticky` on the\n   real <th>/<td> elements that happen to sit in row 0 / the first\n   rendered cell of each row. That's exact when the frozen row/column has\n   no merges crossing it. When a merge DOES span across the frozen\n   boundary (e.g. a header cell with rowSpan reaching past row 0, or a\n   first-column cell absorbed into a merge from a neighboring column so\n   nothing renders at column 0 in that row), sticky positioning is\n   applied on a best-effort basis — whichever real cell renders first in\n   the row still gets `tbl-sticky-col`, which may not visually be \"the\n   first column\" once merges have shifted things. This was a deliberate\n   scope decision (see root CLAUDE.md's instructions for this pass): not\n   worth the complexity of a real column-tracking model for what's meant\n   to be a secondary feature on already-small tables. It never crashes —\n   worst case, freeze looks slightly off on a heavily-merged table.\n   ========================================================================== */\n\n/** Attaches a hover/click tooltip icon to a cell. The popover itself is\n *  appended to document.body and positioned with `position: fixed` from\n *  the icon's own viewport rect — NOT appended inside the table's own\n *  scroll container, so it can't get clipped by that container's\n *  `overflow: auto` (needed for freeze/scrolling on a big table). */\n// Inline links (richtext's `link` mark, created via execCommand in\n// richtext-editor.js) are stored as plain `<a href>` with no target —\n// applied at render time instead of storage time, same reasoning and\n// same function shape as Tabbed Panels' block-renderer.js's\n// forceLinksToNewTab() (no shared module for it — see richtext-editor.js's\n// header comment on why this file is a copy-adapt rather than a\n// promotion).\nfunction forceLinksToNewTab(container) {\n  container.querySelectorAll('a').forEach((a) => {\n    a.target = '_blank';\n    a.rel = 'noopener noreferrer';\n  });\n}\n\nfunction attachCellTooltip(cellEl, text) {\n  const icon = document.createElement('span');\n  icon.className = 'tbl-tooltip-icon';\n  icon.innerHTML = '<i class=\"fa-solid fa-circle-info\"></i>';\n  icon.tabIndex = 0;\n  icon.setAttribute('role', 'button');\n  icon.setAttribute('aria-label', 'More info');\n\n  let popover = null;\n  function show() {\n    hide();\n    popover = document.createElement('div');\n    popover.className = 'tbl-tooltip-popover';\n    popover.textContent = text;\n    document.body.appendChild(popover);\n    const rect = icon.getBoundingClientRect();\n    popover.style.left = Math.round(rect.left) + 'px';\n    popover.style.top = Math.round(rect.bottom + 6) + 'px';\n  }\n  function hide() {\n    if (popover) { popover.remove(); popover = null; }\n  }\n  icon.addEventListener('mouseenter', show);\n  icon.addEventListener('mouseleave', hide);\n  icon.addEventListener('focus', show);\n  icon.addEventListener('blur', hide);\n  icon.addEventListener('click', (e) => { e.stopPropagation(); popover ? hide() : show(); });\n\n  cellEl.appendChild(icon);\n}\n\n/**\n * @param table  a table data object (see table-types.js).\n * @param opts   optional:\n *   - onCellClick(r, c, event) — called when a cell (not its tooltip\n *     icon) is clicked. Authoring-only concern (cell selection lives\n *     entirely in index.html); Export never passes this.\n *   - isSelected(r, c) — returns true if (r, c) should render with the\n *     `.tbl-cell-selected` class. Authoring-only, same as onCellClick.\n *   - showName — false to omit the table's own name heading (Export's\n *     multi-table layout renders names itself via carousel-nav.js\n *     controls in some contexts); defaults to true.\n *   - forExport — true when this render is for the exported/embedded\n *     player rather than the authoring canvas. The ONLY thing this\n *     currently affects is table.showTitleInExport (see table-types.js):\n *     the authoring canvas always shows the table's name (so the author\n *     can identify tables while editing) regardless of that flag, and\n *     only a `forExport: true` render call skips it when the author has\n *     turned it off. Never branch more authoring-vs-export behavior into\n *     this file on this flag without a real reason — see file header on\n *     staying authoring-unaware.\n */\nfunction renderTable(table, opts = {}) {\n  const style = resolveTableStyle(table);\n\n  const wrapper = document.createElement('div');\n  wrapper.className = 'tbl-wrapper';\n  wrapper.dataset.tableId = table.id;\n\n  const showName = opts.showName !== false && table.name && !(opts.forExport && table.showTitleInExport === false);\n  if (showName) {\n    const heading = document.createElement('div');\n    heading.className = 'tbl-name';\n    heading.textContent = table.name;\n    wrapper.appendChild(heading);\n  }\n\n  const scroller = document.createElement('div');\n  scroller.className = 'tbl-scroller';\n  if (table.freezeHeader) scroller.classList.add('tbl-freeze-header');\n  if (table.freezeFirstCol) scroller.classList.add('tbl-freeze-col');\n  if (table.rowSeparatorsOnly) scroller.classList.add('tbl-row-sep-only');\n  // Corner radius lives on this wrapper (overflow: auto already clips,\n  // same as overflow: hidden would), not the <table> — border-radius on\n  // a <table> with border-collapse: collapse doesn't clip reliably. Same\n  // technique Tabbed Panels documents for its own .tp-table-wrapper.\n  scroller.style.borderRadius = (table.cornerRadius != null ? table.cornerRadius : 8) + 'px';\n\n  const tableEl = document.createElement('table');\n  tableEl.className = 'tbl-table' + (table.rowSeparatorsOnly ? ' tbl-row-sep-only' : '');\n  tableEl.style.setProperty('--tbl-border', style.borderColor);\n  tableEl.style.setProperty('--tbl-header-bg', style.headerBg);\n  tableEl.style.setProperty('--tbl-header-text', style.headerText);\n  tableEl.style.setProperty('--tbl-cell-bg', style.cellBg);\n  tableEl.style.setProperty('--tbl-cell-text', style.cellText);\n  tableEl.style.setProperty('--tbl-body-padding', (table.cellPadding != null ? table.cellPadding : 9) + 'px');\n  tableEl.style.setProperty('--tbl-header-padding', (table.headerPadding != null ? table.headerPadding : 9) + 'px');\n  tableEl.style.setProperty('--tbl-body-size', (table.bodyTextSize != null ? table.bodyTextSize : 13) + 'px');\n  tableEl.style.setProperty('--tbl-header-size', (table.headerTextSize != null ? table.headerTextSize : 13) + 'px');\n  tableEl.style.setProperty('--tbl-body-align', table.bodyAlign || 'left');\n  tableEl.style.setProperty('--tbl-header-align', table.headerAlign || 'left');\n  tableEl.style.setProperty('--tbl-body-weight', table.bodyBold ? '700' : '400');\n  tableEl.style.setProperty('--tbl-header-weight', table.headerBold === false ? '400' : '700');\n\n  (table.rows || []).forEach((row, r) => {\n    const tr = document.createElement('tr');\n    let firstRealInRow = true;\n    row.forEach((cell, c) => {\n      if (cell === null) return; // covered by a previous cell's span — see table-types.js\n      const isHeader = table.hasHeaderRow !== false && r === 0;\n      const cellEl = document.createElement(isHeader ? 'th' : 'td');\n      cellEl.className = 'tbl-cell';\n      cellEl.dataset.row = r;\n      cellEl.dataset.col = c;\n      if ((cell.colSpan || 1) > 1) cellEl.colSpan = cell.colSpan;\n      if ((cell.rowSpan || 1) > 1) cellEl.rowSpan = cell.rowSpan;\n      if (r === 0 && table.freezeHeader) cellEl.classList.add('tbl-sticky-row');\n      if (firstRealInRow && table.freezeFirstCol) cellEl.classList.add('tbl-sticky-col');\n      firstRealInRow = false;\n      if (opts.isSelected && opts.isSelected(r, c)) cellEl.classList.add('tbl-cell-selected');\n\n      // Per-cell overrides (see table-types.js) — applied as inline\n      // style so they win over the table-wide/theme CSS-custom-property\n      // values regardless of whether this is a <td> or a themed <th>,\n      // with no extra specificity gymnastics needed. Left unset (null/\n      // undefined) means \"inherit the table-wide value\" — nothing to do.\n      if (cell.cellBg) cellEl.style.background = cell.cellBg;\n      if (cell.cellBold != null) cellEl.style.fontWeight = cell.cellBold ? '700' : '400';\n\n      const textEl = document.createElement('span');\n      textEl.className = 'tbl-cell-text';\n      // sanitizeRichHtml() also safely handles old-shape plain-string\n      // cell.text (pre-richtext saved projects) — see table-types.js's\n      // header comment.\n      textEl.innerHTML = sanitizeRichHtml(cell.text || '');\n      cellEl.appendChild(textEl);\n\n      if (cell.tooltip) attachCellTooltip(cellEl, cell.tooltip);\n\n      if (opts.onCellClick) {\n        cellEl.addEventListener('click', (e) => opts.onCellClick(r, c, e));\n      }\n\n      tr.appendChild(cellEl);\n    });\n    tableEl.appendChild(tr);\n  });\n\n  forceLinksToNewTab(tableEl);\n\n  scroller.appendChild(tableEl);\n  wrapper.appendChild(scroller);\n  return wrapper;\n}\n",
    carouselNav: "/* ==========================================================================\n   Tables — Carousel / Side-by-side Layout Switcher\n   Same role as Tabbed Panels' tab-nav.js: the learner-facing layout\n   mechanism, used UNMODIFIED by both the authoring canvas and the\n   exported player, so what an author sees while editing is what a\n   learner actually gets.\n\n   Two author-chosen base modes (project.layout.mode):\n   - 'side-by-side' — every table renders at once in a CSS grid,\n     `layout.perRow` columns wide.\n   - 'carousel' — one table visible at a time, with prev/next controls.\n\n   Below CAROUSEL_BREAKPOINT, 'side-by-side' automatically collapses to\n   the same single-table-plus-arrows presentation carousel mode always\n   uses — a responsive CSS/JS fallback, NOT a third authored mode (see\n   root CLAUDE.md's brief for this tool). A ResizeObserver on the\n   container re-evaluates this on every resize, so an Articulate embed\n   that's narrow at publish time (or gets resized later) collapses\n   automatically without the author doing anything.\n\n   ---- Collapsed-mode peek + slide (added this pass) ----\n   Collapsed mode ('carousel' or narrow side-by-side) no longer hides\n   every non-active table with `display: none`. Instead all items stay\n   in one `.cn-grid` flex row inside an `overflow: hidden` `.cn-viewport`,\n   each sized to `container width - PEEK*2` px, and the whole row is\n   `translateX`'d so the active item's left edge sits PEEK px in from the\n   viewport's left edge — which puts a PEEK-ish sliver of the previous\n   item's right edge in view to the left, and (since items are laid out\n   left-to-right with GAP px between them) a sliver of the next item's\n   left edge in view to the right. Recomputed on every applyState() call\n   (selection change, nav click, or the existing ResizeObserver firing),\n   so it stays correct across resizes without a separate code path.\n   Prev/next just changes `activeIndex` and re-renders — the CSS\n   `transition: transform` on `.cn-grid` (see index.html / Export's\n   embedded style, guarded under prefers-reduced-motion same as every\n   other micro-animation in this suite) is what makes that read as a\n   slide instead of a jump cut. Peeking neighbours get a lower opacity\n   (`.cn-item-peek`, same transition) so the strip reads as one\n   continuous physical object sliding past a window, not disconnected\n   tables. At the first/last table there's simply nothing to peek on\n   that side — the viewport just shows blank space, which reads the same\n   as normal edge padding.\n   ========================================================================== */\n\nconst CAROUSEL_BREAKPOINT = 620; // px — below this, side-by-side collapses to single-table display\nconst CAROUSEL_PEEK = 36;  // px — how much of a neighbouring table peeks in at each edge\nconst CAROUSEL_GAP = 12;   // px — gap between items in the collapsed flex strip\n\n/**\n * @param container   element to render into (children replaced each call).\n * @param tables      [{ id, ... }, ...] — the full table list, in order.\n * @param layout      { mode: 'side-by-side'|'carousel', perRow }.\n * @param renderItem  (table, index) => DOM node — how to render one\n *                     table's content (index.html/Export both pass a\n *                     small wrapper around table-renderer.js's\n *                     renderTable()).\n * @param activeIndex which table is \"current\" while collapsed to a\n *                     single visible table (ignored, but still tracked,\n *                     in the uncollapsed side-by-side grid).\n * @param onNavigate   (newIndex) => void — called when prev/next is\n *                     clicked; the caller re-invokes this render function\n *                     with the updated activeIndex (same stateless-\n *                     render-function pattern as tab-nav.js's onSelect).\n */\nfunction renderTablesLayout(container, { tables, layout, renderItem, activeIndex, onNavigate }) {\n  // A stray leftover ResizeObserver from a previous render would keep\n  // firing against a container whose children just got wiped — always\n  // disconnect before rebuilding.\n  if (container._cnResizeObserver) { container._cnResizeObserver.disconnect(); container._cnResizeObserver = null; }\n  if (container._cnResizeListener) { window.removeEventListener('resize', container._cnResizeListener); container._cnResizeListener = null; }\n\n  // ---- Real bug fix (Previous not sliding smoothly) ----\n  // Every call to this function throws away and rebuilds the ENTIRE\n  // `.cn-grid` — a brand-new element every time a table is selected\n  // (index.html's onChange re-renders the whole stage on essentially\n  // every state change, including plain prev/next navigation). A CSS\n  // `transition: transform` has nothing to animate FROM on a freshly\n  // inserted node — there's no committed \"before\" style yet. Verified\n  // by sampling getComputedStyle(grid).transform every 25ms across a\n  // real click in a real browser: in BOTH directions the strip actually\n  // animates from translateX(0) (the browser's default identity\n  // transform for a node that's never had one set), never from the\n  // table's real prior on-screen offset. Going from table 0 (true\n  // offset ~+36px, already close to 0) to table 1, animating from 0\n  // instead of 36 is imperceptible — reads as \"Next works\". Going back\n  // from table 1 (true offset e.g. -976px) to table 0 (+36px), animating\n  // from 0 instead of -976 is a completely different, far shorter\n  // motion — the strip barely nudges from ~0 to +36 instead of sliding\n  // the full distance back, which is exactly the reported \"Previous\n  // doesn't slide smoothly\" (it's not asymmetric transform math — the\n  // offset formula below has always been direction-agnostic; it's a\n  // rebuild-loses-continuity bug that only *looks* direction-specific\n  // because of where index 0's offset happens to sit relative to 0).\n  //\n  // Fix: since the grid element can't be preserved across this\n  // rebuild (structural re-render, not just a reposition), manually\n  // replay what the browser would have done for free had the node\n  // persisted — paint the LAST known real offset first, force a style\n  // flush so it's committed as the transition's start value, then set\n  // the real target. `_cnLastOffset`/`_cnWasCollapsed` live on the\n  // container itself so they survive `container.innerHTML = ''` below.\n  const prevOffset = container._cnLastOffset;\n  const prevWasCollapsed = !!container._cnWasCollapsed;\n  let isFirstApply = true;\n\n  container.innerHTML = '';\n  container.className = 'cn-layout';\n\n  // .cn-viewport clips the collapsed-mode flex strip so peeking\n  // neighbours (which deliberately extend past the visible width) don't\n  // widen the page — side-by-side mode doesn't need clipping (nothing\n  // overflows), but leaving it on is harmless there too.\n  const viewport = document.createElement('div');\n  viewport.className = 'cn-viewport';\n  const grid = document.createElement('div');\n  grid.className = 'cn-grid';\n  const items = tables.map((table, i) => {\n    const item = document.createElement('div');\n    item.className = 'cn-item';\n    item.appendChild(renderItem(table, i));\n    grid.appendChild(item);\n    return item;\n  });\n  viewport.appendChild(grid);\n  container.appendChild(viewport);\n\n  const nav = document.createElement('div');\n  nav.className = 'cn-nav';\n  const prevBtn = document.createElement('button');\n  prevBtn.type = 'button';\n  prevBtn.className = 'cn-nav-btn';\n  prevBtn.setAttribute('aria-label', 'Previous table');\n  prevBtn.innerHTML = '<i class=\"fa-solid fa-chevron-left\"></i>';\n  const counter = document.createElement('span');\n  counter.className = 'cn-nav-counter';\n  const nextBtn = document.createElement('button');\n  nextBtn.type = 'button';\n  nextBtn.className = 'cn-nav-btn';\n  nextBtn.setAttribute('aria-label', 'Next table');\n  nextBtn.innerHTML = '<i class=\"fa-solid fa-chevron-right\"></i>';\n  prevBtn.addEventListener('click', () => onNavigate(Math.max(0, activeIndex - 1)));\n  nextBtn.addEventListener('click', () => onNavigate(Math.min(tables.length - 1, activeIndex + 1)));\n  nav.appendChild(prevBtn);\n  nav.appendChild(counter);\n  nav.appendChild(nextBtn);\n  container.appendChild(nav);\n\n  function applyState() {\n    const isCarouselMode = layout.mode === 'carousel';\n    const containerWidth = container.clientWidth;\n    const narrow = containerWidth > 0 && containerWidth < CAROUSEL_BREAKPOINT;\n    const collapsed = isCarouselMode || narrow;\n\n    container.classList.toggle('cn-collapsed', collapsed);\n\n    if (!collapsed) {\n      grid.style.gridTemplateColumns = `repeat(${Math.max(1, layout.perRow || 2)}, 1fr)`;\n      grid.style.transform = '';\n      items.forEach((item) => {\n        item.style.flexBasis = '';\n        item.classList.remove('cn-item-active', 'cn-item-peek');\n      });\n      container._cnWasCollapsed = false;\n    } else {\n      grid.style.gridTemplateColumns = '';\n      // Each item is sized to leave PEEK px of viewport on both sides\n      // for the active item; see the file-header comment for the slide\n      // math this feeds.\n      const itemWidth = Math.max(0, containerWidth - CAROUSEL_PEEK * 2);\n      items.forEach((item, i) => {\n        item.style.flexBasis = itemWidth + 'px';\n        item.classList.toggle('cn-item-active', i === activeIndex);\n        item.classList.toggle('cn-item-peek', i !== activeIndex);\n      });\n      const offset = CAROUSEL_PEEK - activeIndex * (itemWidth + CAROUSEL_GAP);\n\n      // Establish the transition's real start point — see the file-header\n      // comment above for why this is needed at all. Only on the very\n      // first applyState() call after this fresh grid was created (a\n      // later call, e.g. from the ResizeObserver, is operating on a node\n      // that already has a real committed transform from this same\n      // render pass, so a normal CSS transition already works on it).\n      if (isFirstApply && prevWasCollapsed && prevOffset != null && prevOffset !== offset) {\n        grid.style.transition = 'none';\n        grid.style.transform = `translateX(${prevOffset}px)`;\n        grid.getBoundingClientRect(); // force a style/layout flush so the line above is committed, not coalesced away\n        grid.style.transition = '';\n      }\n      grid.style.transform = `translateX(${offset}px)`;\n      container._cnLastOffset = offset;\n      container._cnWasCollapsed = true;\n    }\n    isFirstApply = false;\n\n    const showNav = collapsed && tables.length > 1;\n    nav.style.display = showNav ? 'flex' : 'none';\n    if (showNav) {\n      prevBtn.disabled = activeIndex <= 0;\n      nextBtn.disabled = activeIndex >= tables.length - 1;\n      counter.textContent = `${activeIndex + 1} / ${tables.length}`;\n    }\n  }\n\n  applyState();\n\n  if (window.ResizeObserver) {\n    const ro = new ResizeObserver(applyState);\n    ro.observe(container);\n    container._cnResizeObserver = ro;\n  } else {\n    // Fallback for an environment without ResizeObserver — still\n    // responds to viewport resizes, just not to the container itself\n    // being resized by something other than the window (e.g. a\n    // dynamically-resized embed iframe), which is a smaller gap.\n    window.addEventListener('resize', applyState);\n    container._cnResizeListener = applyState;\n  }\n}\n",
  };

  function openExportModal() {
    const modules = Object.values(MODULE_SOURCES).join('\n\n');
    const state = tableManager.getState();
    const tablesJSON = JSON.stringify(state.tables);
    const layoutJSON = JSON.stringify(state.layout);

    const html = `<!DOCTYPE html>

<title>${currentProjectName || 'Tables'}</title>
</head>
<body>
<div id="tables-layout-host"></div>
<script>
// Fonts and CSS are injected via script rather than static <link>/<style>

// children like <style> and <link rel="stylesheet"> from pasted code

[
  'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css',
  'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap',
].forEach((href) => {
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = href;

const playerStyle = document.createElement('style');
playerStyle.textContent = \`
  * { box-sizing: border-box; }

  .cn-collapsed .cn-item { flex-shrink: 0; transition: opacity 250ms cubic-bezier(0.4, 0, 0.2, 1); }
  .cn-collapsed .cn-item-peek { opacity: 0.55; }
  .cn-nav { display: none; align-items: center; justify-content: center; gap: 16px; }
  .cn-nav-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #E3E1DA; background: #fff; color: #4A5453; cursor: pointer; }
  .cn-nav-btn:hover:not(:disabled) { color: #0C5E82; border-color: #0C5E82; }
  .cn-nav-btn:disabled { opacity: 0.3; cursor: default; }
  .cn-nav-counter { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: #4A5453; min-width: 40px; text-align: center; }

  .tbl-scroller { overflow: auto; max-height: 460px; border: 1px solid var(--tbl-border, #CBC8BE); }
  .tbl-scroller.tbl-row-sep-only { border: none; }

  th.tbl-cell { background: var(--tbl-header-bg, #FAFAF8); color: var(--tbl-header-text, #1C2321); padding: var(--tbl-header-padding, 9px); text-align: var(--tbl-header-align, left); font-size: var(--tbl-header-size, 0.8125rem); font-weight: var(--tbl-header-weight, 600); }

render();

    document.getElementById('export-textarea').value = html;
