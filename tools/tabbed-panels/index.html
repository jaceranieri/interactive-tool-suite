<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tabbed Panels</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/design-tokens.css">
<link rel="stylesheet" href="../../shared/app-shell.css">
<style>
  #shell-main { min-height: 0; }

  /* Left rail: one icon button per block type — same "icon-only vertical
     stack" pattern as Animated Slides v2's left rail. */
  #left-rail {
    width: 64px; background: var(--surface); border-right: 1px solid var(--border);
    padding: var(--space-4) var(--space-2); overflow-y: auto; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
  }
  .add-block-btn {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); cursor: pointer;
    transition: border-color var(--duration-fast) var(--ease-standard), background var(--duration-fast) var(--ease-standard);
  }
  .add-block-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .add-block-btn i { font-size: 16px; color: var(--accent); }

  #content-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* Tab strip */
  #tab-strip { flex-shrink: 0; padding: var(--space-3) var(--space-5); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--space-2); overflow-x: auto; }
  .tab-chip { position: relative; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--paper); cursor: pointer; font-size: var(--text-sm); }
  .tab-chip.active { border-color: var(--ink); background: var(--accent-soft); font-weight: 600; }
  .tab-chip.dragging { opacity: 0.4; }
  .tab-chip.drag-over { border-color: var(--accent); }
  .tab-chip .tab-name-input { font-family: var(--font-ui); font-size: var(--text-sm); border: none; background: transparent; outline: none; width: 90px; }
  .tab-chip-close { border: none; background: none; color: var(--ink-faint); cursor: pointer; padding: 0 2px; font-size: 11px; }
  .tab-chip-close:hover { color: var(--danger); }
  #add-tab-btn { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; border: 1px dashed var(--border-strong); background: var(--surface); cursor: pointer; color: var(--ink-soft); }
  #add-tab-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Block list (the learner-facing preview surface, editable in place) */
  #stage { flex: 1; overflow-y: auto; padding: var(--space-6); }
  #block-list { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-3); }
  #block-list-empty { text-align: center; color: var(--ink-faint); padding: var(--space-8) 0; }
  .tp-block { position: relative; border: 2px solid transparent; border-radius: var(--radius-sm); padding: var(--space-2); cursor: pointer; }
  .tp-block:hover { border-color: var(--border); }
  .tp-block.selected { border-color: var(--accent); background: var(--accent-soft); }
  .tp-block.dragging { opacity: 0.4; }
  .tp-block.drag-over { border-top: 2px solid var(--accent); }
  .tp-block-controls { position: absolute; top: -14px; right: 4px; display: none; gap: 2px; }
  .tp-block:hover .tp-block-controls, .tp-block.selected .tp-block-controls { display: flex; }
  .tp-block-controls button { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-sm); width: 24px; height: 24px; cursor: pointer; font-size: 10px; color: var(--ink-soft); }
  .tp-block-controls button:hover { color: var(--danger); border-color: var(--danger); }

  /* Learner-facing block appearance (mirrors what Export will ship) */
  .tp-heading { margin: 0; }
  .tp-paragraph { line-height: 1.5; }
  .tp-paragraph:empty::before { content: 'Empty text block'; color: var(--ink-faint); font-style: italic; }
  .tp-list { margin: 0; padding-left: 1.4em; line-height: 1.5; }
  .tp-button { display: inline-block; padding: 10px 20px; border-radius: var(--radius-sm); text-decoration: none; font-weight: 600; font-size: var(--text-sm); }
  .tp-button-primary { background: var(--accent); color: #fff; }
  .tp-button-secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--border-strong); }
  .tp-block-separator hr { border: none; border-top: 1px solid var(--border); margin: var(--space-2) 0; }

  /* Property drawer — same .side-panel pattern as v2's layers/settings drawers */
  .side-panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 320px; background: var(--surface);
    border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); transform: translateX(100%);
    transition: transform var(--duration-base) var(--ease-standard); display: flex; flex-direction: column; z-index: 5; pointer-events: none;
  }
  .side-panel.active { transform: translateX(0); pointer-events: auto; }
  .side-panel-header { display: flex; align-items: flex-start; justify-content: space-between; padding: var(--space-5); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .side-panel-header h2 { margin: 0; font-size: var(--text-lg); font-weight: 600; }
  .side-panel-body { flex: 1; overflow-y: auto; padding: var(--space-5); }
  #canvas-wrapper { position: relative; flex: 1; min-height: 0; display: flex; }

  .popup-field { margin-bottom: var(--space-4); }
  .popup-field:last-child { margin-bottom: 0; }
  .popup-field label { display: block; font-size: 10px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
  .popup-field input, .popup-field select, .popup-field textarea { width: 100%; font-family: var(--font-ui); font-size: var(--text-sm); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 7px; box-sizing: border-box; }
  .popup-field.toggle-field { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
  .popup-field.toggle-field label { margin-bottom: 0; }
  .switch { position: relative; display: inline-block; width: 38px; height: 22px; flex-shrink: 0; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch-slider { position: absolute; inset: 0; background: var(--border-strong); border-radius: 999px; cursor: pointer; transition: background var(--duration-fast) var(--ease-standard); }
  .switch-slider::before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; box-shadow: var(--shadow-sm); transition: transform var(--duration-fast) var(--ease-standard); }
  .switch input:checked + .switch-slider { background: var(--accent); }
  .switch input:checked + .switch-slider::before { transform: translateX(16px); }

  /* Richtext toolbar/editable — used both inline in block property panels
     and for list-item fields. */
  .tp-richtext-field { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .tp-richtext-toolbar { display: flex; gap: 2px; padding: 4px; background: var(--paper); border-bottom: 1px solid var(--border); }
  .tp-richtext-btn { width: 26px; height: 26px; border: none; background: transparent; border-radius: var(--radius-sm); cursor: pointer; color: var(--ink-soft); }
  .tp-richtext-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .tp-richtext-editable { min-height: 60px; padding: 8px; font-size: var(--text-sm); outline: none; }

  .array-field-item { display: flex; align-items: flex-start; gap: 6px; margin-bottom: var(--space-2); }
  .array-field-item .tp-richtext-field { flex: 1; }
  .array-field-remove { border: none; background: none; color: var(--ink-faint); cursor: pointer; padding: 4px; flex-shrink: 0; }
  .array-field-remove:hover { color: var(--danger); }
  .array-field-add { width: 100%; padding: 6px; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; color: var(--ink-soft); margin-top: 4px; }
  .no-selection-hint { color: var(--ink-faint); font-size: var(--text-sm); text-align: center; padding: var(--space-6) 0; }
</style>
</head>
<body>

<div id="shell">
  <div id="top-bar">
    <div class="top-bar-left">
      <a href="#" class="hub-link" title="Back to hub">&larr;</a>
      <div class="tool-identity">
        <div class="title-block">Tool &middot; Tabbed Panels</div>
        <h1 id="display-project-name">Untitled project</h1>
        <span id="unsaved-dot" title="Unsaved changes" style="display:none; width:8px; height:8px; border-radius:50%; background:var(--warn); margin-left:8px; vertical-align:middle;"></span>
      </div>
    </div>
    <div class="top-bar-right">
      <span id="shell-status" class="status-pill"><span class="dot"></span>Not connected</span>
      <div class="top-bar-divider"></div>
      <button class="btn btn-secondary" onclick="newProject()">New</button>
      <button class="btn btn-secondary" onclick="Shell.openModal('open-modal'); refreshProjectList();">Open</button>
      <div class="top-bar-divider"></div>
      <button class="btn btn-secondary" id="undo-btn" onclick="history.undo()">Undo</button>
      <button class="btn btn-secondary" id="redo-btn" onclick="history.redo()">Redo</button>
      <div class="top-bar-divider"></div>
      <button class="btn btn-primary" onclick="saveProject()"><i class="fa-solid fa-cloud-arrow-up"></i> Save</button>
    </div>
  </div>

  <div id="shell-main" style="display:flex;">
    <div id="left-rail"></div>

    <div id="content-col">
      <div id="tab-strip"></div>

      <div id="canvas-wrapper">
        <div id="stage">
          <div id="block-list"></div>
        </div>

        <div class="side-panel" id="property-panel">
          <div class="side-panel-header">
            <h2>Block settings</h2>
            <button class="modal-close" onclick="deselectBlock()">&times;</button>
          </div>
          <div class="side-panel-body" id="property-panel-body"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Open project modal -->
<div class="modal-overlay" id="open-modal">
  <div class="modal-dialog">
    <div class="modal-header">
      <div><div class="title-block">Open</div><h2>Your projects</h2></div>
      <button class="modal-close" onclick="Shell.closeModal('open-modal')">&times;</button>
    </div>
    <div class="modal-body"><div id="project-list"></div></div>
  </div>
</div>

<script src="../../shared/app-shell.js"></script>
<script src="../../shared/storage-connector.js"></script>
<script src="tab-types.js"></script>
<script src="richtext-editor.js"></script>
<script src="block-renderer.js"></script>
<script src="tab-manager.js"></script>
<script src="history.js"></script>
<script>
  const TOOL_ID = 'tabbed-panels';
  // Same placeholder convention as animated-slides-v2 — real values only
  // get substituted in the Apps Script deployed copy, never here. See
  // CLAUDE.md's deployment pipeline section.
  Storage.configure('STORAGE_ENDPOINT_PLACEHOLDER', 'STORAGE_API_KEY_PLACEHOLDER');

  let currentProjectName = null;
  let hasUnsavedChanges = false;
  let selectedBlockId = null;

  const tabManager = new TabManager({ tabs: null });
  const history = new History({
    getState: () => tabManager.getState(),
    setState: (s) => tabManager.setState(s),
    onChange: () => {
      document.getElementById('undo-btn').disabled = !history.canUndo();
      document.getElementById('redo-btn').disabled = !history.canRedo();
    },
  });

  tabManager.onChange = () => { markUnsaved(); renderAll(); };

  function markUnsaved() {
    hasUnsavedChanges = true;
    document.getElementById('unsaved-dot').style.display = 'inline-block';
  }
  function markSaved() {
    hasUnsavedChanges = false;
    document.getElementById('unsaved-dot').style.display = 'none';
  }

  /* ---- Left rail: one "add block" button per BLOCK_TYPES entry ---- */

  function renderLeftRail() {
    const rail = document.getElementById('left-rail');
    rail.innerHTML = '';
    Object.entries(BLOCK_TYPES).forEach(([type, schema]) => {
      const btn = document.createElement('button');
      btn.className = 'add-block-btn';
      btn.title = 'Add ' + schema.label;
      btn.setAttribute('aria-label', 'Add ' + schema.label);
      btn.innerHTML = `<i class="fa-solid ${schema.icon}"></i>`;
      btn.addEventListener('click', () => {
        history.beginAction();
        const id = tabManager.addBlock(type, selectedBlockId);
        history.commitAction();
        selectBlock(id);
      });
      rail.appendChild(btn);
    });
  }

  /* ---- Tab strip ---- */

  function renderTabStrip() {
    const strip = document.getElementById('tab-strip');
    strip.innerHTML = '';
    tabManager.tabs.forEach((tab) => {
      const chip = document.createElement('div');
      chip.className = 'tab-chip' + (tab.id === tabManager.activeTabId ? ' active' : '');
      chip.draggable = true;
      chip.dataset.tabId = tab.id;

      const name = document.createElement('span');
      name.textContent = tab.title;
      name.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        startRenameTab(chip, tab);
      });
      chip.appendChild(name);

      if (tabManager.tabs.length > 1) {
        const closeBtn = document.createElement('button');
        closeBtn.className = 'tab-chip-close';
        closeBtn.innerHTML = '&times;';
        closeBtn.title = 'Delete tab';
        closeBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const ok = await Shell.confirm(`Delete "${tab.title}"? This can't be undone with Undo across a reload.`, { heading: 'Delete tab', okLabel: 'Delete', danger: true });
          if (!ok) return;
          history.beginAction();
          tabManager.deleteTab(tab.id);
          history.commitAction();
        });
        chip.appendChild(closeBtn);
      }

      chip.addEventListener('click', () => { deselectBlock(); tabManager.setActiveTab(tab.id); });

      chip.addEventListener('dragstart', () => chip.classList.add('dragging'));
      chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
      chip.addEventListener('dragover', (e) => { e.preventDefault(); chip.classList.add('drag-over'); });
      chip.addEventListener('dragleave', () => chip.classList.remove('drag-over'));
      chip.addEventListener('drop', (e) => {
        e.preventDefault();
        chip.classList.remove('drag-over');
        const draggedId = strip.querySelector('.dragging')?.dataset.tabId;
        if (!draggedId) return;
        history.beginAction();
        tabManager.moveTabAfter(draggedId, tab.id);
        history.commitAction();
      });

      strip.appendChild(chip);
    });

    const addBtn = document.createElement('button');
    addBtn.id = 'add-tab-btn';
    addBtn.title = 'Add tab';
    addBtn.setAttribute('aria-label', 'Add tab');
    addBtn.innerHTML = '<i class="fa-solid fa-plus"></i>';
    addBtn.addEventListener('click', () => {
      history.beginAction();
      tabManager.addTab();
      history.commitAction();
    });
    strip.appendChild(addBtn);
  }

  function startRenameTab(chip, tab) {
    const input = document.createElement('input');
    input.className = 'tab-name-input';
    input.value = tab.title;
    chip.replaceChildren(input);
    input.focus();
    input.select();
    const commit = () => {
      history.beginAction();
      tabManager.renameTab(tab.id, input.value.trim() || tab.title);
      history.commitAction();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') { input.value = tab.title; input.blur(); }
    });
  }

  /* ---- Block list (content area) ---- */

  function renderBlockList() {
    const tab = tabManager.getActiveTab();
    const container = document.getElementById('block-list');
    container.innerHTML = '';

    if (tab.blocks.length === 0) {
      const empty = document.createElement('div');
      empty.id = 'block-list-empty';
      empty.textContent = 'No blocks yet — add one from the left rail.';
      container.appendChild(empty);
      return;
    }

    tab.blocks.forEach((data) => {
      const el = renderBlock(data); // block-renderer.js — authoring-unaware
      el.classList.toggle('selected', data.id === selectedBlockId);
      el.draggable = true;

      const controls = document.createElement('div');
      controls.className = 'tp-block-controls';
      const delBtn = document.createElement('button');
      delBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
      delBtn.title = 'Delete block';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        history.beginAction();
        tabManager.deleteBlock(data.id);
        history.commitAction();
        if (selectedBlockId === data.id) deselectBlock();
      });
      controls.appendChild(delBtn);
      el.appendChild(controls);

      el.addEventListener('click', () => selectBlock(data.id));
      el.addEventListener('dragstart', () => el.classList.add('dragging'));
      el.addEventListener('dragend', () => el.classList.remove('dragging'));
      el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drag-over'); });
      el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
      el.addEventListener('drop', (e) => {
        e.preventDefault();
        el.classList.remove('drag-over');
        const draggedId = container.querySelector('.dragging')?.dataset.blockId;
        if (!draggedId) return;
        history.beginAction();
        tabManager.moveBlockAfter(draggedId, data.id);
        history.commitAction();
      });

      container.appendChild(el);
    });
  }

  /* ---- Property panel (schema-driven, mirrors v2's settings-panel generation) ---- */

  function selectBlock(id) {
    selectedBlockId = id;
    renderBlockList();
    renderPropertyPanel();
    document.getElementById('property-panel').classList.add('active');
  }
  function deselectBlock() {
    selectedBlockId = null;
    document.getElementById('property-panel').classList.remove('active');
    renderBlockList();
  }

  function renderPropertyPanel() {
    const body = document.getElementById('property-panel-body');
    body.innerHTML = '';
    if (!selectedBlockId) return;
    const tab = tabManager.getActiveTab();
    const data = tab.blocks.find((b) => b.id === selectedBlockId);
    if (!data) return;
    const schema = BLOCK_TYPES[data.type];

    document.querySelector('#property-panel .side-panel-header h2').textContent = schema.label + ' settings';

    let pendingAction = false;
    function begin() { if (!pendingAction) { history.beginAction(); pendingAction = true; } }
    function commit(patch) { tabManager.updateBlock(data.id, patch); }
    function commitEnd() { history.commitAction(); pendingAction = false; }

    Object.entries(schema.fields).forEach(([key, field]) => {
      const wrap = document.createElement('div');
      wrap.className = 'popup-field';
      const label = document.createElement('label');
      label.textContent = field.label;
      wrap.appendChild(label);

      if (field.type === 'richtext') {
        const holder = document.createElement('div');
        attachRichTextField(holder, {
          value: data[key],
          inline: field.inline,
          onChange: (html) => { begin(); commit({ [key]: html }); commitEnd(); },
        });
        wrap.appendChild(holder);
      } else if (field.type === 'select') {
        const select = document.createElement('select');
        field.options.forEach(([val, text]) => {
          const opt = document.createElement('option');
          opt.value = val; opt.textContent = text;
          if (val === data[key]) opt.selected = true;
          select.appendChild(opt);
        });
        select.addEventListener('change', () => { begin(); commit({ [key]: select.value }); commitEnd(); });
        wrap.appendChild(select);
      } else if (field.type === 'boolean') {
        wrap.classList.add('toggle-field');
        const switchLabel = document.createElement('label');
        switchLabel.className = 'switch';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = !!data[key];
        input.addEventListener('change', () => { begin(); commit({ [key]: input.checked }); commitEnd(); });
        const slider = document.createElement('span');
        slider.className = 'switch-slider';
        switchLabel.appendChild(input);
        switchLabel.appendChild(slider);
        wrap.appendChild(switchLabel);
      } else if (field.type === 'array') {
        const listHolder = document.createElement('div');
        const items = data[key];
        items.forEach((itemVal, i) => {
          const row = document.createElement('div');
          row.className = 'array-field-item';
          const itemHolder = document.createElement('div');
          attachRichTextField(itemHolder, {
            value: itemVal,
            inline: field.of.inline,
            onChange: (html) => { begin(); items[i] = html; commit({ [key]: items }); commitEnd(); },
          });
          row.appendChild(itemHolder);
          const removeBtn = document.createElement('button');
          removeBtn.className = 'array-field-remove';
          removeBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
          removeBtn.title = 'Remove item';
          removeBtn.addEventListener('click', () => {
            if (items.length <= 1) return; // keep at least one item
            history.beginAction();
            items.splice(i, 1);
            commit({ [key]: items });
            history.commitAction();
            renderPropertyPanel();
          });
          row.appendChild(removeBtn);
          listHolder.appendChild(row);
        });
        const addBtn = document.createElement('button');
        addBtn.className = 'array-field-add';
        addBtn.textContent = '+ Add item';
        addBtn.addEventListener('click', () => {
          history.beginAction();
          items.push('');
          commit({ [key]: items });
          history.commitAction();
          renderPropertyPanel();
        });
        listHolder.appendChild(addBtn);
        wrap.appendChild(listHolder);
      } else {
        // text / url
        const input = document.createElement('input');
        input.type = field.type === 'url' ? 'url' : 'text';
        input.value = data[key];
        input.addEventListener('focus', begin);
        input.addEventListener('input', () => commit({ [key]: input.value }));
        input.addEventListener('blur', commitEnd);
        wrap.appendChild(input);
      }

      body.appendChild(wrap);
    });
  }

  function renderAll() {
    renderTabStrip();
    renderBlockList();
    if (selectedBlockId && !tabManager.getActiveTab().blocks.some((b) => b.id === selectedBlockId)) deselectBlock();
  }

  /* ---- Project lifecycle (New / Save / Open) — same pattern as v2 ---- */

  async function newProject() {
    if (hasUnsavedChanges) {
      const proceed = await Shell.confirm('Starting a new project will discard them.', { heading: 'Unsaved changes', okLabel: 'Discard and continue', danger: true });
      if (!proceed) return;
    }
    tabManager.setState({ activeTabId: null, tabs: [defaultTab('Tab 1')] });
    currentProjectName = null;
    document.getElementById('display-project-name').textContent = 'Untitled project';
    deselectBlock();
    markSaved();
  }

  async function saveProject() {
    let name = currentProjectName;
    if (!name) {
      name = await Shell.prompt('', '', { heading: 'Name this project', okLabel: 'Save' });
      if (!name) return;
    }
    const pending = Shell.toast('Saving to GitHub…', 'pending');
    try {
      await Storage.saveProject(TOOL_ID, name, tabManager.getState());
      currentProjectName = name;
      document.getElementById('display-project-name').textContent = name;
      pending.remove();
      Shell.toast(`Project "${name}" saved!`, 'success');
      Shell.setStatus('Connected', '');
      markSaved();
    } catch (error) {
      pending.remove();
      Shell.toast(`Save failed: ${error.message}`, 'danger');
      Shell.setStatus('Error', 'error');
    }
  }

  async function refreshProjectList() {
    const pending = Shell.toast('Fetching projects…', 'pending');
    try {
      const { projects } = await Storage.listProjects(TOOL_ID);
      pending.remove();
      Shell.renderProjectList(
        document.getElementById('project-list'), projects,
        (name) => loadProject(name),
        {
          onRename: (oldName, newName) => renameProjectFlow(oldName, newName),
          onDelete: (name) => deleteProjectFlow(name),
        },
      );
    } catch (error) {
      pending.remove();
      Shell.toast(`Fetch failed: ${error.message}`, 'danger');
    }
  }

  async function loadProject(name) {
    Shell.closeModal('open-modal');
    const pending = Shell.toast(`Loading "${name}"...`, 'pending');
    try {
      const { content } = await Storage.loadProject(TOOL_ID, name);
      tabManager.setState(content);
      currentProjectName = name;
      document.getElementById('display-project-name').textContent = name;
      deselectBlock();
      markSaved();
      pending.remove();
      Shell.toast(`Project "${name}" loaded!`, 'success');
    } catch (error) {
      pending.remove();
      Shell.toast(`Load failed: ${error.message}`, 'danger');
    }
  }

  async function renameProjectFlow(oldName, newName) {
    const pending = Shell.toast(`Renaming "${oldName}"…`, 'pending');
    try {
      await Storage.renameProject(TOOL_ID, oldName, newName);
      if (currentProjectName === oldName) {
        currentProjectName = newName;
        document.getElementById('display-project-name').textContent = newName;
      }
      pending.remove();
      Shell.toast(`Renamed to "${newName}"`, 'success');
      refreshProjectList();
    } catch (error) {
      pending.remove();
      Shell.toast(`Rename failed: ${error.message}`, 'danger');
    }
  }

  async function deleteProjectFlow(name) {
    const ok = await Shell.confirm(`Delete "${name}"? This can't be undone.`, { heading: 'Delete project', okLabel: 'Delete', danger: true });
    if (!ok) return;
    const pending = Shell.toast(`Deleting "${name}"…`, 'pending');
    try {
      await Storage.deleteProject(TOOL_ID, name);
      pending.remove();
      Shell.toast(`Deleted "${name}"`, 'success');
      refreshProjectList();
    } catch (error) {
      pending.remove();
      Shell.toast(`Delete failed: ${error.message}`, 'danger');
    }
  }

  /* ---- Boot ---- */
  Shell.init({ toolName: 'Tabbed Panels' });
  Shell.bindOverlayDismiss();
  renderLeftRail();
  renderAll();
  history.onChange();
</script>
</body>
</html>
